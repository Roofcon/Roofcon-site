    /* KARRIERE */

    .content {
      background:#39332f;

   /* GRILLE DES CARTES */

.cards {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 30px;
  justify-content: start;
  align-items: start;
  max-width: 1200px;
  margin: 0;
}

/* CARTE */

.card {
  width: 100%;
  max-width: 570px;
  min-width: 0;
  justify-self: start;

  background: #262322;
  border: 1px solid #3b3634;
  overflow: hidden;

  display: flex;
  flex-direction: column;

  transition: none;
}

    .card:hover {
      transform:translateY(-6px);
      background:#2c2928;
      border-color:#5a514d;
    }

   .card img {
  width: 100%;
  height: 380px;
  object-fit: cover;
  object-position: center;
  display: block;
  transition: none;
}

    .card:hover img {
      transform:scale(1.035);
    }

    .card-body {
      padding:30px;
      flex:1;
      display:flex;
      flex-direction:column;
      align-items:flex-start;
    }

    .card h2 {
      color:#fff;
      font-size:clamp(22px,2.2vw,29px);
      line-height:1.12;
      letter-spacing:-.02em;
      margin:0 0 16px;
    }

    .card p {
      color:#c9c4c0;
      font-size:15px;
      line-height:1.7;
      white-space:pre-line;
      margin:0 0 28px;
    }

    .btn {
      display:inline-flex;
      align-items:center;
      gap:10px;
      margin-top:auto;
      padding:0;
      background:none;
      color:#fff;
      border:none;
      font-family:inherit;
      font-size:11px;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.14em;
      text-decoration:none;
      cursor:pointer;
      transition:gap .3s ease,opacity .3s ease;
    }

    .btn::after {
      content:"→";
      font-size:17px;
      line-height:1;
      transition:transform .3s ease;
    }

    .btn:hover {
      background:none;
      color:#fff;
      opacity:.8;
      gap:15px;
    }

    .btn:hover::after {
      transform:translateX(3px);
    }

    .empty {
      grid-column:1 / -1;
      padding:35px;
      background:#262322;
      border:1px solid #3b3634;
      color:#c9c4c0;
      text-align:center;
    }

    /* FUSSBEREICH */

    footer {
      background:#171616;
      color:#aaa;
      padding:40px 0;
      font-size:13px;
    }

    .footer-grid {
      display:grid;
      grid-template-columns:1.2fr 1fr 1fr 1fr;
      gap:35px;
    }

    .footer-logo {

     .lang {

    });
    setText('footer-email', site.email);
    setText('footer-address-title', {
      fr: 'Adresse',
      de: 'Adresse'
    });
    setText('footer-address', site.address);
    setText('footer-hours', site.hours);
    setText('footer-social-title', {
      fr: 'Suivez-nous',
      de: 'Folgen Sie uns'
    });
    setText('footer-copyright', footer.copyright);

   const phone = document.getElementById('footer-phone');

if (phone) {
  const phoneNumber = site.phone || '+352 621 765 489';
  const phoneHref = phoneNumber.replace(/[^\d+]/g, '');

  phone.innerHTML = `
    <div style="margin-bottom:5px;">Joël Brück</div>
    <a href="tel:${phoneHref}">${safeText(phoneNumber)}</a>
  `;
}

    const email = document.getElementById('footer-email');
    if (email && site.email) {
      email.href = 'mailto:' + site.email;
    }

    const facebook = document.getElementById('footer-facebook');
    if (facebook && site.facebook) {
      facebook.href = site.facebook;
      facebook.target = '_blank';
      facebook.rel = 'noopener noreferrer';
    }

    const instagram = document.getElementById('footer-instagram');
    if (instagram && site.instagram) {
      instagram.href = site.instagram;
      instagram.target = '_blank';
      instagram.rel = 'noopener noreferrer';
    }
  }

  document.documentElement.lang = PAGE_LANG;

  const mobileButton = document.getElementById('mobile-menu-button');
  const mainMenu = document.getElementById('main-menu');

  mobileButton.addEventListener('click', () => {
    const isOpen = mainMenu.classList.toggle('mobile-open');
    mobileButton.setAttribute('aria-expanded', String(isOpen));
    mobileButton.setAttribute(
      'aria-label',
      isOpen ? 'Menü schließen' : 'Menü öffnen'
    );
    mobileButton.textContent = isOpen ? '×' : '☰';
  });

  document.getElementById('lang-fr').classList.toggle('active', PAGE_LANG === 'fr');
  document.getElementById('lang-de').classList.toggle('active', PAGE_LANG === 'de');

  document.getElementById('lang-fr').href = ROUTES[PAGE_TYPE].fr;
  document.getElementById('lang-de').href = ROUTES[PAGE_TYPE].de;

  document.getElementById('nav-home').textContent = t.home;
  document.getElementById('nav-services').textContent = t.services;
  document.getElementById('nav-current').textContent = t.current;
  document.getElementById('nav-references').textContent = t.references;
  document.getElementById('nav-jobs').textContent = t.jobs;
  document.getElementById('nav-contact').textContent = t.contact;

document.getElementById('nav-home').href = '/?lang=de';
  document.getElementById('nav-services').href = '/leistungen/';
  document.getElementById('nav-current').href = '/aktuelle-projekte/';
  document.getElementById('nav-references').href = '/referenzen/';
  document.getElementById('nav-jobs').href = ROUTES.jobs[PAGE_LANG];
  document.getElementById('nav-contact').href = ROUTES.contact[PAGE_LANG];

  document.getElementById('page-kicker').textContent = t.jobsKicker;
  document.getElementById('page-title').textContent = t.jobsTitle;
  document.getElementById('page-intro').textContent = t.jobsIntro;

  document.getElementById('footer-legal-1').textContent = 'Impressum';
  document.getElementById('footer-legal-2').textContent = 'Datenschutzerklärung';
  document.getElementById('footer-legal-3').textContent = 'Cookie-Richtlinie';

  const jobsContent = document.getElementById('jobs-content');

  fetch('/content.json')
    .then(response => {
      if (!response.ok) {
        throw new Error('content.json konnte nicht geladen werden');
      }
      return response.json();
    })
    .then(data => {
      renderFooter(data);

      const jobs = (data.jobs && data.jobs.items) || [];

      if (!jobs.length) {
        jobsContent.innerHTML =
          '<div class="empty">' + t.noJobs + '</div>';
        return;
      }

      jobsContent.innerHTML = jobs.map(job => {
        const title = job.title && job.title[PAGE_LANG] || '';
        const description = job.description && job.description[PAGE_LANG] || '';

       
        const imageList = job.images && !Array.isArray(job.images)
          ? job.images[PAGE_LANG]
          : job.images;

        const images = Array.isArray(imageList)
          ? imageList
          : (job.image ? [job.image] : []);

        const imageHtml = images.length
          ? `<img
              class="job-image"
              src="${images[0].startsWith('http') || images[0].startsWith('/') ? images[0] : '/' + images[0].replace(/^\.?\//, '')}"
              alt="${title.replace(/&/g, '&amp;').replace(/"/g, '&quot;')}"
              loading="lazy"
              onclick="openJobImage(this.src)"
              title="${PAGE_LANG === 'de' ? 'Zum Vergrößern anklicken' : 'Cliquer pour agrandir'}"
              style="cursor:zoom-in;"
            >`
          : '';


        return `
          <article class="card">
            ${imageHtml}
            <div class="card-body">
              <h2>${title}</h2>
              <p>${description}</p>
              <a class="btn"
                 href="mailto:info@roof-con.com?subject=${encodeURIComponent(t.apply + ' - ' + title)}">
                ${t.apply}
              </a>
            </div>
          </article>
        `;
      }).join('');
    })
    .catch(error => {
      console.error(error);
      jobsContent.innerHTML =
        '<div class="empty">Die Stellenangebote konnten nicht geladen werden. Bitte versuchen Sie es später erneut.</div>';
    });

  function openJobImage(src) {
    const modal = document.getElementById('image-modal');
    const image = document.getElementById('image-modal-content');

    image.src = src;
    modal.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeJobImage() {
    const modal = document.getElementById('image-modal');

    modal.classList.remove('open');
    document.body.style.overflow = '';
  }

  document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') {
      closeJobImage();
    }
  });
</script>

</body>
</html>
