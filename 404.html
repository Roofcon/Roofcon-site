<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <title>ROOFCON</title>

  <script>
    const path = window.location.pathname
      .replace(/^\/+|\/+$/g, '');

    const routes = {

      /* 🇫🇷 Français */
      'services': 'about',
      'realisations': 'references',
      'projets-en-cours': 'current-projects',
      'emploi': 'jobs',
      'contact': 'contact',

      /* 🇩🇪 Deutsch */
      'leistungen': 'about',
      'referenzen': 'references',
      'aktuelle-projekte': 'current-projects',
      'karriere': 'jobs',
      'kontakt': 'contact'
    };

    const page = routes[path] || 'accueil';

    window.location.replace(
      '/?page=' + encodeURIComponent(page)
    );
  </script>
</head>

<body></body>
</html>
