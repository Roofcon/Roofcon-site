<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Nos services | Toiture, charpente & façade ventilée | ROOFCON</title>
  <meta name="description" content="Découvrez les services de ROOFCON au Luxembourg : façades ventilées, toitures plates, charpentes, couvertures et constructions en ossature bois.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://roof-con.com/services/">
  <link rel="alternate" hreflang="fr-LU" href="https://roof-con.com/services/">
  <link rel="alternate" hreflang="de-LU" href="https://roof-con.com/leistungen/">
  <link rel="alternate" hreflang="x-default" href="https://roof-con.com/services/">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Nos services | ROOFCON">
  <meta property="og:description" content="Façades ventilées, toitures plates, charpentes, couvertures et constructions en ossature bois au Luxembourg.">
  <meta property="og:url" content="https://roof-con.com/services/">

  <style>
    :root {
      --black: #211f20;
      --brown: #a27b5b;
      --brown2: #c3a080;
      --cream: #f5f2ee;
      --white: #fff;
      --gray: #706b67;
      --line: #e5dfda;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: var(--black);
      background: #fff;
      line-height: 1.6;
    }

    a { color: inherit; }
    button { font: inherit; }

    .container {
      width: min(1180px, 92%);
      margin: auto;
    }

    /* BARRE SUPÉRIEURE */

    .top {
      background: var(--black);
      color: #ddd;
      font-size: 12px;
      padding: 8px 0;
    }

    .top-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .top a {
      color: inherit;
      text-decoration: none;
    }

    /* EN-TÊTE ET MENU */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, .97);
      border-bottom: 1px solid var(--line);
    }

    .nav {
      min-height: 92px;
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .logo {
      display: block;
      width: 165px;
      height: auto;
    }

    .lang {
      display: flex;
      gap: 5px;
      margin-left: auto;
    }

    .lang button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--black);
      padding: 7px 10px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }

    .lang button.active {
      background: var(--black);
      color: #fff;
      border-color: var(--black);
    }

    .menu {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 13px;
    }

    .menu a {
      text-decoration: none;
      white-space: nowrap;
      transition: color .2s ease, background-color .2s ease;
    }

    .menu a:hover { color: var(--brown); }

    .menu .cta {
      background: var(--brown);
      color: #fff;
      padding: 12px 17px;
      transition: background-color .25s ease, transform .25s ease,
                  box-shadow .25s ease;
    }

    .menu .cta:hover {
      transform: translateY(-2px);
      background: var(--black);
      color: #fff;
      box-shadow: 0 6px 16px rgba(33, 31, 32, .18);
    }

    .mobile-menu-button { display: none; }

    /* SECTION SERVICES */

    .about {
      position: relative;
      background: #fff;
      padding: 92px 0;
    }

    .about-intro {
      max-width: 850px;
      margin-bottom: 42px;
    }

    .kicker {
      color: var(--brown);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .about-intro h1 {
      font-size: clamp(34px, 4vw, 54px);
      line-height: 1.1;
      letter-spacing: -1.5px;
      margin: 0 0 20px;
    }

    .about-intro p {
      color: var(--gray);
      font-size: 17px;
      max-width: 800px;
      margin: 0;
    }

    .poles {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
    }

    .pole {
      min-width: 0;
      min-height: 100%;
      padding: 28px;
      background: #fff;
      border: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      transition: transform .3s ease, box-shadow .3s ease,
                  border-color .3s ease;
    }

    .pole:hover {
      transform: translateY(-7px);
      box-shadow: 0 18px 35px rgba(0, 0, 0, .18);
      border-color: var(--brown);
    }

    .pole-number {
      color: var(--brown);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    .pole h2 {
      font-size: 23px;
      line-height: 1.25;
      margin: 0 0 12px;
    }

    .pole p {
      color: var(--gray);
      font-size: 14px;
      margin: 0 0 22px;
      flex-grow: 1;
    }

    .pole-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 14px;
      margin-top: auto;
    }

    .pole-more {
      color: var(--brown);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }

    .pole-more:hover { text-decoration: underline; }

    .pole-discover {
      display: inline-block;
      border: 1px solid var(--black);
      background: var(--black);
      color: #fff;
      padding: 11px 17px;
      text-decoration: none;
      font-size: 13px;
      cursor: pointer;
      transition: transform .25s ease, background-color .25s ease,
                  color .25s ease, box-shadow .25s ease;
    }

    .pole-discover:hover {
      transform: translateY(-2px);
      background: var(--brown);
      border-color: var(--brown);
      box-shadow: 0 8px 20px rgba(33, 31, 32, .15);
    }

    /* ANIMATIONS */

    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity .7s ease, transform .7s ease;
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* PIED DE PAGE */

    footer {
      background: #171616;
      color: #aaa;
      padding: 40px 0;
      font-size: 13px;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr 1fr;
      gap: 35px;
    }

    .footer-logo {
      width: 150px;
      background: #fff;
      padding: 7px;
      margin-bottom: 15px;
    }

    .footer-title {
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .footer-item { margin-bottom: 7px; }

    .footer-item a {
      color: inherit;
      text-decoration: none;
    }

    .footer-item a:hover,
    .footer-social a:hover {
      color: var(--brown2);
    }

    .footer-social a {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 10px;
      color: #aaa;
      text-decoration: none;
    }

    .footer-bottom {
      border-top: 1px solid #302d2b;
      margin-top: 30px;
      padding-top: 20px;
      color: #777;
    }

    .footer-legal {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .footer-legal a {
      color: #777;
      text-decoration: none;
    }

    .footer-legal a:hover { color: var(--brown2); }

    /* TABLETTES */

    @media (max-width: 1000px) {
      .nav { gap: 14px; }
      .menu { gap: 14px; font-size: 12px; }
      .logo { width: 145px; }
      .poles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .footer-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    /* MOBILES */

    @media (max-width: 750px) {
      .top { display: none; }

      .nav {
        min-height: 76px;
        position: relative;
      }

      .logo { width: 145px; }

      .mobile-menu-button {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--black);
        cursor: pointer;
        font-size: 26px;
        line-height: 1;
      }

      .menu {
        display: none;
        position: absolute;
        top: 76px;
        left: 0;
        right: 0;
        background: #fff;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        flex-direction: column;
        align-items: stretch;
        gap: 0;
        padding: 8px 0;
        box-shadow: 0 10px 25px rgba(0, 0, 0, .10);
      }

      .menu.mobile-open { display: flex; }

      .menu a {
        display: block;
        width: 100%;
        padding: 16px 24px;
        font-size: 15px;
        border-bottom: 1px solid #eee;
      }

      .menu a:last-child { border-bottom: 0; }

      .menu a:hover {
        background: var(--cream);
        color: var(--brown);
      }

      .menu .cta {
        margin: 8px 16px;
        width: auto;
        text-align: center;
      }

      .lang { margin-left: auto; margin-right: 0; }
      .lang button { padding: 6px 8px; font-size: 12px; }

      .about { padding: 65px 0; }

      .about-intro h1 { letter-spacing: -1px; }
      .about-intro p { font-size: 16px; }

      .poles,
      .footer-grid {
        grid-template-columns: 1fr;
      }

      .pole {
        min-height: 0;
        padding: 22px;
      }

      .pole h2 { margin-bottom: 8px; }
      .pole p { margin-bottom: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="top">
    <div class="container top-inner">
      <span>ROOFCON — Holzbau · Bedachung · Fassadenbau</span>
      <span>
        <a href="tel:+352621765489">+352 621 765 489</a>
        ·
        <a href="mailto:info@roof-con.com">info@roof-con.com</a>
      </span>
    </div>
  </div>

  <header>
    <div class="container nav">
      <a href="/" aria-label="ROOFCON — Accueil">
        <img class="logo" src="/ROOFCON.png" alt="ROOFCON">
      </a>

      <div class="lang" aria-label="Choisir la langue">
        <button type="button" id="lang-fr" class="active" aria-pressed="true">FR</button>
        <button type="button" id="lang-de" aria-pressed="false">DE</button>
      </div>

      <button
        type="button"
        class="mobile-menu-button"
        id="mobile-menu-button"
        aria-label="Ouvrir le menu"
        aria-expanded="false"
      >☰</button>

      <nav class="menu" id="main-menu" aria-label="Navigation principale">
        <a href="/">Accueil</a>
        <a href="/services/" aria-current="page">Nos services</a>
        <a href="/projets-en-cours/">Projets en cours</a>
        <a href="/realisations/">Réalisations</a>
        <a href="/emploi/">Offres d'emploi</a>
        <a href="/contact/" class="cta">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section id="about" class="about">
      <div class="container">
        <div class="about-intro">
          <div class="kicker" id="about-kicker"></div>
          <h1 id="about-title"></h1>
          <p id="about-intro"></p>
        </div>
        <div class="poles" id="poles-grid"></div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <div class="footer-grid">
        <div>
          <img src="/ROOFCON.png" class="footer-logo" alt="ROOFCON">
          <div id="footer-description"></div>
        </div>

        <div>
          <div class="footer-title" id="footer-contact-title"></div>
          <div class="footer-item" id="footer-phone"></div>
          <div class="footer-item" id="footer-email"></div>
        </div>

        <div>
          <div class="footer-title" id="footer-address-title"></div>
          <div class="footer-item" id="footer-address"></div>
          <div class="footer-item" id="footer-hours"></div>
        </div>

        <div>
          <div class="footer-title" id="footer-social-title"></div>
          <div class="footer-social">
            <a id="footer-facebook" target="_blank" rel="noopener noreferrer">Facebook</a>
            <a id="footer-instagram" target="_blank" rel="noopener noreferrer">Instagram</a>
          </div>
        </div>
      </div>

      <div class="footer-bottom">
        <div id="footer-copyright"></div>
        <div class="footer-legal">
          <a href="/mentions-legales.html" id="footer-legal-1">Mentions légales</a> ·
          <a href="/politique-confidentialite.html" id="footer-legal-2">Politique de confidentialité</a> ·
          <a href="/politique-cookies.html" id="footer-legal-3">Politique des cookies</a>
        </div>
      </div>
    </div>
  </footer>

  <script>
    const CONTENT_URL = "/content.json";

    const menu = document.getElementById("main-menu");
    const mobileButton = document.getElementById("mobile-menu-button");
    let CONTENT = null;
    let LANG = "fr";

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]);
    }

    function localized(value) {
      if (value && typeof value === "object") {
        return value[LANG] ?? value.fr ?? "";
      }
      return value ?? "";
    }

    function assetURL(path) {
      if (!path) return "";
      if (/^(https?:)?\/\//i.test(path) || path.startsWith("/")) return path;
      return "/" + path.replace(/^\.?\//, "");
    }

    function renderServices() {
      const about = CONTENT.about;

      document.getElementById("about-kicker").textContent =
        localized(about.kicker);

      document.getElementById("about-title").textContent =
        localized(about.title);

      document.getElementById("about-intro").textContent =
        localized(about.intro);

      document.getElementById("poles-grid").innerHTML =
        about.poles.map(pole => {
          const title = localized(pole.title);
          const text = localized(pole.text);

          const detailLinks = {
            facades: {
              fr: "/facades-ventilees/",
              de: "/de/hinterlueftete-fassaden/",
              textFr: "En savoir plus sur les façades ventilées",
              textDe: "Mehr über hinterlüftete Fassaden"
            },
            toitures: {
              fr: "/toitures-plates/",
              de: "/de/flachdaecher/",
              textFr: "En savoir plus sur les toitures plates",
              textDe: "Mehr über Flachdächer"
            },
            charpentes: {
              fr: "/charpentes/",
              de: "/de/dachstuhlbau/",
              textFr: "En savoir plus sur les charpentes",
              textDe: "Mehr über den Dachstuhlbau"
            },
            couvertures: {
              fr: "/couvertures/",
              de: "/de/dachdeckungen/",
              textFr: "En savoir plus sur les couvertures",
              textDe: "Mehr über Dachdeckungen"
            },
            maisons: {
              fr: "/maisons-annexes-ossature-bois/",
              de: "/de/holzhaeuser-anbauten/",
              textFr: "En savoir plus sur les maisons en ossature bois",
              textDe: "Mehr über Holzhäuser in Holzrahmenbauweise"
            }
          };

          const link = detailLinks[pole.id];
          const detailHref = link ? link[LANG] : "#";
          const moreText = link
            ? (LANG === "fr" ? link.textFr : link.textDe)
            : "";

          const image = pole.image
            ? `<img class="pole-image" src="${escapeHTML(assetURL(pole.image))}" alt="${escapeHTML(title)}" loading="lazy">`
            : "";

          return `
            <article class="pole reveal">
              ${image}
              <div class="pole-number">${escapeHTML(pole.number)}</div>
              <h2>${escapeHTML(title)}</h2>
              <p>${escapeHTML(text)}</p>
              <div class="pole-actions">
                <a class="pole-more" href="${escapeHTML(detailHref)}">${escapeHTML(moreText)}</a>
                <a class="pole-discover" href="${LANG === "fr" ? "/realisations/" : "/referenzen/"}">${LANG === "fr" ? "Découvrir" : "Entdecken"}</a>
              </div>
            </article>
          `;
        }).join("");

      setupReveal();
    }

    function setupReveal() {
      const elements = document.querySelectorAll(".reveal");

      if (!("IntersectionObserver" in window)) {
        elements.forEach(element => element.classList.add("visible"));
        return;
      }

      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add("visible");
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12 });

      elements.forEach(element => observer.observe(element));
    }

    function renderFooter() {
      const site = CONTENT.site;
      const footer = CONTENT.footer;

      document.getElementById("footer-description").textContent =
        localized(footer.description);

      document.getElementById("footer-contact-title").textContent =
        LANG === "fr" ? "Contact" : "Kontakt";

      document.getElementById("footer-phone").innerHTML =
        `<a href="tel:${escapeHTML(site.phone.replace(/\s/g, ""))}">${escapeHTML(site.phone)}</a>`;

      document.getElementById("footer-email").innerHTML =
        `<a href="mailto:${escapeHTML(site.email)}">${escapeHTML(site.email)}</a>`;

      document.getElementById("footer-address-title").textContent =
        LANG === "fr" ? "Adresse" : "Adresse";

      document.getElementById("footer-address").textContent =
        site.address + ", Luxembourg";

      document.getElementById("footer-hours").textContent =
        localized(site.hours);

      document.getElementById("footer-social-title").textContent =
        LANG === "fr" ? "Suivez-nous" : "Folgen Sie uns";

      document.getElementById("footer-facebook").href = site.facebook;
      document.getElementById("footer-instagram").href = site.instagram;

      document.getElementById("footer-copyright").textContent =
        localized(footer.copyright);

      document.getElementById("footer-legal-1").textContent =
        LANG === "fr" ? "Mentions légales" : "Impressum";

      document.getElementById("footer-legal-2").textContent =
        LANG === "fr" ? "Politique de confidentialité" : "Datenschutzerklärung";

      document.getElementById("footer-legal-3").textContent =
        LANG === "fr" ? "Politique des cookies" : "Cookie-Richtlinie";
    }

    function renderNavigation() {
      const nav = CONTENT.nav;

      const links = menu.querySelectorAll("a");
      links[0].textContent = localized(nav.home);
      links[1].textContent = localized(nav.about);
      links[2].textContent = LANG === "fr" ? "Projets en cours" : "Aktuelle Projekte";
      links[3].textContent = localized(nav.references);
      links[4].textContent = localized(nav.jobs);
      links[5].textContent = localized(nav.contact);

      links[0].href = "/";
      links[1].href = LANG === "fr" ? "/services/" : "/leistungen/";
      links[2].href = LANG === "fr" ? "/projets-en-cours/" : "/aktuelle-projekte/";
      links[3].href = LANG === "fr" ? "/realisations/" : "/referenzen/";
      links[4].href = LANG === "fr" ? "/emploi/" : "/karriere/";
      links[5].href = LANG === "fr" ? "/contact/" : "/kontakt/";
    }

    function updateSEO() {
      const seo = CONTENT.seo.services;

      document.title = localized(seo.title);

      document.querySelector('meta[name="description"]').content =
        localized(seo.description);

      const canonical = LANG === "fr"
        ? "https://roof-con.com/services/"
        : "https://roof-con.com/leistungen/";

      document.querySelector('link[rel="canonical"]').href = canonical;

      document.querySelector('meta[property="og:title"]').content =
        localized(seo.title);

      document.querySelector('meta[property="og:description"]').content =
        localized(seo.description);

      document.querySelector('meta[property="og:url"]').content = canonical;

      document.querySelector('link[hreflang="fr-LU"]').href =
        "https://roof-con.com/services/";

      document.querySelector('link[hreflang="de-LU"]').href =
        "https://roof-con.com/leistungen/";

      document.querySelector('link[hreflang="x-default"]').href =
        "https://roof-con.com/services/";
    }

    function setLanguage(lang) {
      LANG = lang;

      document.documentElement.lang = lang;

      document.getElementById("lang-fr").classList.toggle("active", lang === "fr");
      document.getElementById("lang-de").classList.toggle("active", lang === "de");

      document.getElementById("lang-fr").setAttribute(
        "aria-pressed", String(lang === "fr")
      );

      document.getElementById("lang-de").setAttribute(
        "aria-pressed", String(lang === "de")
      );

      renderServices();
      renderFooter();
      renderNavigation();
      updateSEO();

      history.replaceState(
        {},
        "",
        lang === "fr" ? "/services/" : "/leistungen/"
      );

      menu.classList.remove("mobile-open");
      mobileButton.setAttribute("aria-expanded", "false");
      mobileButton.textContent = "☰";
    }

    document.getElementById("lang-fr").addEventListener(
      "click", () => setLanguage("fr")
    );

    document.getElementById("lang-de").addEventListener(
      "click", () => setLanguage("de")
    );

    mobileButton.addEventListener("click", () => {
      const isOpen = menu.classList.toggle("mobile-open");
      mobileButton.setAttribute("aria-expanded", String(isOpen));
      mobileButton.textContent = isOpen ? "×" : "☰";
    });

    fetch(CONTENT_URL, { cache: "no-store" })
      .then(response => {
        if (!response.ok) {
          throw new Error("Impossible de charger content.json : " + response.status);
        }
        return response.json();
      })
      .then(data => {
        CONTENT = data;
        setLanguage("fr");
      })
      .catch(error => {
        console.error(error);
        document.getElementById("about-title").textContent =
          "Impossible de charger les services. Veuillez réessayer plus tard.";
      });
  </script>
</body>
</html>
