<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ROOFCON</title>
<meta name="description" content="ROOFCON — Façades ventilées, toitures plates, charpentes et couvertures.">

<style>
:root{
  --black:#211f20;
  --brown:#a27b5b;
  --brown2:#c3a080;
  --cream:#f5f2ee;
  --white:#fff;
  --gray:#706b67;
  --line:#e5dfda;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  color:var(--black);
  line-height:1.6;
  background:#fff;
}

a{
  text-decoration:none;
  color:inherit;
}

button,
input,
textarea{
  font-family:inherit;
}

.container{
  width:min(1180px,92%);
  margin:auto;
}

/* TOP BAR */

.top{
  background:var(--black);
  color:#eee;
  font-size:13px;
}

.top .inner{
  min-height:38px;
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:28px;
  flex-wrap:wrap;
}

/* HEADER */

header{
  background:#fff;
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  z-index:30;
}

.nav{
  min-height:92px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  width:190px;
  display:block;
}

.menu{
  display:flex;
  align-items:center;
  gap:25px;
  font-size:14px;
  font-weight:800;
}

.menu a:hover{
  color:var(--brown);
}

.menu .cta{
  background:var(--brown);
  color:#fff;
  padding:12px 18px;
}

.menu .cta:hover{
  background:var(--black);
}

.lang{
  display:flex;
  gap:4px;
  margin-left:auto;
}

.lang button{
  border:1px solid var(--line);
  background:#fff;
  color:var(--black);
  padding:7px 10px;
  font-weight:800;
  cursor:pointer;
}

.lang button.active{
  background:var(--brown);
  color:#fff;
  border-color:var(--brown);
}

/* PAGES */

section{
  padding:92px 0;
  display:none;
}

section.active-page{
  display:block;
}

/* HERO */

.hero{
  min-height:690px;
  position:relative;
  display:none;
  align-items:center;
  overflow:hidden;

  background:
    linear-gradient(
      90deg,
      rgba(20,18,18,.93) 0%,
      rgba(20,18,18,.76) 47%,
      rgba(20,18,18,.25) 100%
    ),
    linear-gradient(
      135deg,
      #292626 0%,
      #685344 55%,
      #b29273 100%
    );
}

.hero.active-page{
  display:flex;
}

.hero.has-image{
  background-position:center;
  background-size:cover;
  background-repeat:no-repeat;
}

.hero:before{
  content:"";
  position:absolute;
  right:-120px;
  top:-160px;
  width:600px;
  height:600px;
  border:95px solid rgba(195,160,128,.18);
  transform:rotate(45deg);
}

.hero .container{
  position:relative;
  z-index:2;
}

.hero-content{
  max-width:760px;
  color:#fff;
  padding:80px 0;
}

.hero-logo{
  width:min(330px,70vw);
  height:auto;
  margin-bottom:32px;
  background:#fff;
  padding:12px;
}

.kicker{
  text-transform:uppercase;
  letter-spacing:3px;
  font-size:13px;
  font-weight:800;
  color:var(--brown2);
  margin-bottom:15px;
}

h1{
  font-size:clamp(45px,6.5vw,80px);
  line-height:.98;
  letter-spacing:-3px;
  margin-bottom:24px;
}

h1 span{
  color:#c3a080;
}

.hero p{
  font-size:19px;
  color:#eee;
  max-width:650px;
  margin-bottom:32px;
}

.buttons{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.btn{
  display:inline-block;
  padding:15px 23px;
  font-weight:800;
  border:1px solid transparent;
  cursor:pointer;
}

.primary{
  background:var(--brown);
  color:#fff;
}

.primary:hover{
  background:var(--black);
}

.outline{
  border-color:rgba(255,255,255,.55);
  color:#fff;
}

.outline:hover{
  background:#fff;
  color:var(--black);
}

/* HEADINGS */

.head{
  max-width:760px;
  margin-bottom:46px;
}

.head h2{
  font-size:clamp(32px,4.2vw,54px);
  line-height:1.05;
  letter-spacing:-1.5px;
}

.head p{
  color:var(--gray);
  font-size:18px;
  margin-top:14px;
}

  /* QUI SOMMES-NOUS */

.who{
  background:#fff;
}

.who-content{
  max-width:850px;
  font-size:18px;
  color:var(--gray);
}

.who-content p{
  margin-bottom:22px;
}

.who-content strong{
  color:var(--black);
}

.who-content .btn{
  margin-top:10px;
}
/* ABOUT */

.about{
  background:var(--black);
  color:#fff;
}

.about-intro{
  max-width:850px;
  margin-bottom:50px;
}

.about-intro h2{
  font-size:clamp(34px,4.5vw,58px);
  line-height:1.05;
  margin-bottom:20px;
}

.about-intro p{
  color:#c9c4c0;
  font-size:18px;
}

.poles{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
}

.pole{
  background:#2c2928;
  border:1px solid #403b39;
  min-height:330px;
  padding:30px;
  position:relative;
  overflow:hidden;
}

.pole-image{
  width:calc(100% + 60px);
  height:170px;
  object-fit:cover;
  margin:-30px -30px 25px;
  display:block;
}

.pole-number{
  font-size:13px;
  color:var(--brown2);
  font-weight:900;
  letter-spacing:2px;
}

.pole h3{
  font-size:24px;
  margin:18px 0 10px;
}

.pole p{
  color:#c9c4c0;
  font-size:15px;
}

/* REFERENCES */

.refs{
  background:var(--cream);
}

.refs-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
}

.ref{
  position:relative;
  overflow:hidden;
  min-height:300px;
  background:
    linear-gradient(135deg,#c9c1ba,#685c53);
  cursor:pointer;
  transition:.25s;
}

.ref:hover{
  transform:translateY(-5px);
  box-shadow:0 15px 35px #211f2012;
}

.ref-image{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

.ref-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(
    transparent 25%,
    rgba(20,18,18,.88) 100%
  );
}

.ref .label{
  position:absolute;
  left:18px;
  right:18px;
  bottom:18px;
  color:#fff;
  z-index:2;
}

.ref .label small{
  color:var(--brown2);
  text-transform:uppercase;
  font-weight:800;
  letter-spacing:1px;
}

.ref .label h3{
  font-size:24px;
  margin-top:5px;
}

/* REFERENCE DETAIL */

.reference-detail{
  background:#fff;
}

.detail-back{
  display:inline-block;
  margin-bottom:30px;
  color:var(--brown);
  font-weight:800;
}

.detail-projects{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.project{
  background:#fff;
  border:1px solid var(--line);
  overflow:hidden;
}

.project img{
  width:100%;
  height:260px;
  object-fit:cover;
  display:block;
}

.project-content{
  padding:22px;
}

.project h3{
  font-size:22px;
  margin-bottom:8px;
}

.project p{
  color:var(--gray);
}

/* JOBS */

.jobs{
  background:#fff;
}

.jobs-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px;
}

.job{
  border:1px solid var(--line);
  background:var(--cream);
  overflow:hidden;
}

.job img{
  width:100%;
  height:240px;
  object-fit:cover;
  display:block;
}
.job-gallery{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:2px;
  background:var(--line);
}

.job-gallery img{
  width:100%;
  height:240px;
  object-fit:cover;
  display:block;
}

.job-gallery img:only-child{
  grid-column:1 / -1;
}
  
.job-gallery img{
  cursor:pointer;
}

.job-lightbox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.88);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
  padding:30px;
}

.job-lightbox img{
  max-width:95vw;
  max-height:90vh;
  object-fit:contain;
  box-shadow:0 10px 40px rgba(0,0,0,.5);
}

.job-lightbox-close{
  position:absolute;
  top:20px;
  right:30px;
  color:#fff;
  font-size:40px;
  cursor:pointer;
  line-height:1;
}  
.job-content{
  padding:28px;
}

.job h3{
  font-size:27px;
  margin-bottom:10px;
}

.job p{
  color:var(--gray);
  white-space:pre-line;
}

.job-button{
  display:inline-block;
  margin-top:20px;
}

/* CONTACT */

.contact{
  background:#fff;
}

.contact-grid{
  display:grid;
  grid-template-columns:1.05fr .95fr;
  gap:60px;
}

.contact-title{
  font-size:clamp(34px,4.5vw,58px);
  line-height:1.05;
}

.contact-intro{
  color:var(--gray);
  font-size:18px;
  margin-top:16px;
}

.contact-details{
  margin-top:30px;
}

.item{
  padding:16px 0;
  border-top:1px solid var(--line);
}

.item small{
  display:block;
  color:var(--brown);
  text-transform:uppercase;
  font-weight:800;
  letter-spacing:1px;
  margin-bottom:3px;
}

.item a,
.item span{
  font-size:19px;
  font-weight:700;
}

.contact-card{
  background:var(--black);
  color:#fff;
  padding:42px;
}

.contact-card h3{
  font-size:30px;
  margin-bottom:8px;
}

.contact-card p{
  color:#c8c3bf;
  margin-bottom:25px;
}

.contact-form{
  display:grid;
  gap:14px;
}

.contact-form label{
  font-size:13px;
  font-weight:800;
  color:#c8c3bf;
}

.contact-form input,
.contact-form textarea{
  width:100%;
  padding:13px 14px;
  border:1px solid #514b48;
  background:#2c2928;
  color:#fff;
  outline:none;
}

.contact-form textarea{
  min-height:130px;
  resize:vertical;
}

.contact-form input:focus,
.contact-form textarea:focus{
  border-color:var(--brown2);
}

/* FOOTER */

footer{
  background:#171616;
  color:#aaa;
  padding:40px 0;
  font-size:13px;
}

.footer-grid{
  display:grid;
  grid-template-columns:1.2fr 1fr 1fr 1fr;
  gap:35px;
}

.footer-logo{
  width:150px;
  background:#fff;
  padding:7px;
  margin-bottom:15px;
}

.footer-title{
  color:#fff;
  font-size:14px;
  font-weight:800;
  margin-bottom:12px;
}

.footer-item{
  margin-bottom:7px;
}

.footer-social a{
  display:block;
  margin-bottom:7px;
}

.footer-social a:hover{
  color:var(--brown2);
}

.footer-bottom{
  border-top:1px solid #302d2b;
  margin-top:30px;
  padding-top:20px;
  color:#777;
}

/* EMPTY STATES */

.empty{
  grid-column:1/-1;
  background:var(--cream);
  padding:50px;
  text-align:center;
  color:var(--gray);
}

/* MOBILE */

@media(max-width:1000px){

  .menu{
    gap:14px;
    font-size:12px;
  }

  .poles{
    grid-template-columns:1fr 1fr;
  }

  .refs-grid{
    grid-template-columns:1fr 1fr;
  }

  .footer-grid{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:750px){

  .top{
    display:none;
  }

  .nav{
    min-height:76px;
  }

  .logo{
    width:145px;
  }

  .menu{
    display:none;
  }

  .lang{
    margin-left:auto;
  }

  section{
    padding:65px 0;
  }

  .hero{
    min-height:620px;
  }

  h1{
    letter-spacing:-2px;
  }

  .hero p{
    font-size:17px;
  }

  .poles,
  .refs-grid,
  .jobs-grid,
  .contact-grid,
  .detail-projects,
  .footer-grid{
    grid-template-columns:1fr;
  }

  .ref{
    min-height:250px;
  }

  .contact-card{
    padding:28px;
  }
}
</style>
</head>

<script>

let CONTENT = null;

let LANG = localStorage.getItem('roofconLang') || 'fr';


/* TRADUCTION */

function t(obj){

  if(typeof obj === 'string'){
    return obj;
  }

  return obj && obj[LANG] ? obj[LANG] : '';

}


/* PROTECTION HTML */

function esc(v){

  return String(v ?? '').replace(/[&<>"']/g,function(m){

    return {
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'
    }[m];

  });

}


/* NAVIGATION */

function showPage(id){

  document.querySelectorAll('section').forEach(function(section){

    section.classList.remove('active-page');

  });

  const page=document.getElementById(id);

  if(page){
    page.classList.add('active-page');
  }

  window.scrollTo({
    top:0,
    behavior:'smooth'
  });

}


/* LANGUE */

function setLang(lang){

  LANG=lang;

  localStorage.setItem('roofconLang',lang);

  if(CONTENT){
    render();
  }

}


/* RÉFÉRENCE */

function openReference(id){

  if(!CONTENT || !CONTENT.references){
    return;
  }

  const ref=CONTENT.references.items.find(function(x){

    return x.id===id;

  });

  if(!ref){
    return;
  }

  document.getElementById('detail-kicker').textContent=
    LANG==='fr'
      ? 'Nos réalisations'
      : 'Unsere Referenzen';

  document.getElementById('detail-title').textContent=
    t(ref.title);

  document.getElementById('detail-intro').textContent=
    LANG==='fr'
      ? 'Découvrez nos projets réalisés dans ce domaine.'
      : 'Entdecken Sie unsere Projekte in diesem Bereich.';

  document.getElementById('detail-back-text').textContent=
    LANG==='fr'
      ? 'Retour aux références'
      : 'Zurück zu den Referenzen';

  const projects=ref.projects || [];

  const container=document.getElementById('detail-projects');

  if(projects.length===0){

    container.innerHTML=`
      <div class="empty">
        ${
          LANG==='fr'
            ? 'Les projets seront bientôt ajoutés.'
            : 'Die Projekte werden bald hinzugefügt.'
        }
      </div>
    `;

  }else{

    container.innerHTML=projects.map(function(project){

      return `

        <article class="project">

          ${
            project.image
              ? `
                <img
                  src="${esc(project.image)}"
                  alt="${esc(t(project.title))}">
              `
              : ''
          }

          <div class="project-content">

            <h3>
              ${esc(t(project.title))}
            </h3>

            <p>
              ${esc(t(project.description))}
            </p>

          </div>

        </article>

      `;

    }).join('');

  }

  showPage('reference-detail');

}


/* AFFICHAGE PRINCIPAL */

    c.site.email;

  document.getElementById('nav-home').textContent=
    t(c.nav.home);

  document.getElementById('nav-about').textContent=
    t(c.nav.about);

  document.getElementById('nav-references').textContent=
    t(c.nav.references);

  document.getElementById('nav-jobs').textContent=
    t(c.nav.jobs);

  document.getElementById('nav-contact').textContent=
    t(c.nav.contact);


  /* HERO */

  document.getElementById('hero-kicker').textContent=

    hero.classList.remove('has-image');

    hero.style.backgroundImage='';

  }

/* QUI SOMMES-NOUS */

document.getElementById('who-kicker').textContent=

document.getElementById('who-title').textContent=
  t(c.who.title);

  t(c.who.intro);

  t(c.who.text1);

document.getElementById('who-text-2').textContent=
  t(c.who.text2);

document.getElementById('who-text-3').textContent=
  t(c.who.text3);

document.getElementById('who-text-4').textContent=
  t(c.who.text4);

document.getElementById('who-objective').textContent=
  t(c.who.objective);

document.getElementById('who-hallcon').textContent=
  t(c.who.hallcon);
  /* À PROPOS */

  document.getElementById('about-kicker').textContent=
    t(c.about.kicker);

  document.getElementById('about-title').textContent=
    t(c.about.title);

  document.getElementById('about-intro').textContent=
    t(c.about.intro);


  document.getElementById('poles-grid').innerHTML=
    c.about.poles.map(function(pole){

      return `

        <article class="pole">

          ${
            pole.image
              ? `
                <img
                  class="pole-image"
                  src="${esc(pole.image)}"
                  alt="${esc(t(pole.title))}">
              `
              : ''
          }

          <div class="pole-number">
            ${esc(pole.number)}
          </div>

          <h3>
            ${esc(t(pole.title))}
          </h3>

          <p>
            ${esc(t(pole.text))}
          </p>

        </article>

      `;

    }).join('');


  /* RÉFÉRENCES */

  document.getElementById('refs-kicker').textContent=
    t(c.references.kicker);

  document.getElementById('refs-title').textContent=
    t(c.references.title);

  document.getElementById('refs-intro').textContent=
    t(c.references.intro);


  document.getElementById('refs-grid').innerHTML=
    c.references.items.map(function(ref){

      return `

        <article
          class="ref reference-card"
          data-reference-id="${esc(ref.id)}">

          ${
            ref.image
              ? `
                <img
                  class="ref-image"
                  src="${esc(ref.image)}"
                  alt="${esc(t(ref.title))}">
              `
              : ''
          }

          <div class="ref-overlay"></div>

          <div class="label">

            <small>
              ${
                LANG==='fr'
                  ? 'Référence'
                  : 'Referenz'
              }
            </small>

            <h3>
              ${esc(t(ref.title))}
            </h3>

          </div>

        </article>

      `;

    }).join('');


/* OFFRES D'EMPLOI */

document.getElementById('jobs-kicker').textContent=
  t(c.jobs.kicker);

document.getElementById('jobs-title').textContent=
  t(c.jobs.title);

document.getElementById('jobs-intro').textContent=
  t(c.jobs.intro);


const jobs=c.jobs.items || [];

if(jobs.length===0){

  document.getElementById('jobs-grid').innerHTML=`

    <div class="empty">

      ${
        LANG==='fr'
          ? 'Aucune offre d’emploi disponible actuellement.'
          : 'Derzeit sind keine Stellenangebote verfügbar.'
      }

    </div>

  `;

}else{

  document.getElementById('jobs-grid').innerHTML=
    jobs.map(function(job){

      let images=[];

      if(Array.isArray(job.images)){
        images=job.images;
      }else if(job.image){
        images=[job.image];
      }

      return `

        <article class="job">

          ${
            images.length
              ?
              `
                <div class="job-gallery">

                  ${images.map(function(image,index){

                    return `

                     <img
  src="${esc(image)}"
  alt="${esc(t(job.title))} - Photo ${index+1}"
  onclick="openJobImage('${esc(image)}')"
>

                    `;

                  }).join('')}

                </div>
              `
              :
              ''
          }

          <div class="job-content">

            <h3>
              ${esc(t(job.title))}
            </h3>

            <p>
              ${esc(t(job.description))}
            </p>

            <a
              class="btn primary job-button"
              href="mailto:${esc(c.site.email)}?subject=${encodeURIComponent('Candidature ROOFCON - '+t(job.title))}">

                LANG==='fr'

}
  /* CONTACT */

    c.site.address;

  document.getElementById('contact-hours').textContent=

  document.getElementById('label-address').textContent=

  document.getElementById('form-name-label').textContent=
    t(c.contact.form.name);

  document.getElementById('form-email-label').textContent=
    t(c.contact.form.email);

  document.getElementById('form-phone-label').textContent=
    t(c.contact.form.phone);

  document.getElementById('form-message-label').textContent=
    t(c.contact.form.message);

  document.getElementById('form-submit').textContent=
    t(c.contact.form.submit);


  /* FOOTER */

  document.getElementById('footer-description').textContent=
    t(c.footer.description);

  document.getElementById('footer-copyright').textContent=
    t(c.footer.copyright);

  document.getElementById('footer-phone').textContent=
    c.site.phone;

  document.getElementById('footer-email').textContent=
    c.site.email;

  document.getElementById('footer-address').textContent=
    c.site.address;

  document.getElementById('footer-hours').textContent=
    t(c.site.hours);


  document.getElementById('footer-contact-title').textContent=
    LANG==='fr' ? 'Contact' : 'Kontakt';

  document.getElementById('footer-address-title').textContent=
    LANG==='fr' ? 'Bureau' : 'Büro';

  document.getElementById('footer-social-title').textContent=
    LANG==='fr' ? 'Réseaux sociaux' : 'Soziale Netzwerke';


  /* FACEBOOK */

  const facebook=document.getElementById('footer-facebook');

  if(c.site.facebook){

    facebook.href=c.site.facebook;
    facebook.textContent='Facebook';
    facebook.style.display='block';

  }else{

    facebook.style.display='none';

  }


  /* INSTAGRAM */

  const instagram=document.getElementById('footer-instagram');

  if(c.site.instagram){

    instagram.href=c.site.instagram;
    instagram.textContent='Instagram';
    instagram.style.display='block';

  }else{

    instagram.style.display='none';

  }


  /* BOUTONS LANGUE */

  document.querySelectorAll('.lang button').forEach(function(button){

    button.classList.toggle(
      'active',
      button.textContent.trim().toLowerCase()===LANG
    );

  });

}


/* CLICS */

document.addEventListener('click',function(e){

  const link=e.target.closest('[data-page]');

  if(link){

    e.preventDefault();

    showPage(link.dataset.page);

    return;

  }


  const reference=e.target.closest('.reference-card');

  if(reference){

    openReference(
      reference.dataset.referenceId
    );

  }

});


/* FORMULAIRE */

document.getElementById('contact-form')
.addEventListener('submit',function(e){

  e.preventDefault();

  const name=document.getElementById('form-name').value;
  const email=document.getElementById('form-email').value;
  const phone=document.getElementById('form-phone').value;
  const message=document.getElementById('form-message').value;


  const subject=
    LANG==='fr'
      ? 'Demande de contact ROOFCON'
      : 'Kontaktanfrage ROOFCON';


  const body=

    (LANG==='fr'
      ? 'Nom : '
      : 'Name : ')

    +name+

    '\n'+

    (LANG==='fr'
      ? 'E-mail : '
      : 'E-Mail : ')

    +email+

    '\n'+

    (LANG==='fr'
      ? 'Téléphone : '
      : 'Telefon : ')

    +phone+

    '\n\n'+

    (LANG==='fr'
      ? 'Demande :\n'
      : 'Anfrage :\n')

    +message;


  window.location.href=
    'mailto:'+CONTENT.site.email+
    '?subject='+
    encodeURIComponent(subject)+
    '&body='+
    encodeURIComponent(body);

});


/* CHARGEMENT */

fetch('./content.json?v='+Date.now())

.then(function(response){

  if(!response.ok){

    throw new Error(
      'Impossible de charger content.json'
    );

  }

  return response.json();

})

.then(function(data){

  CONTENT=data;

  render();

  showPage('accueil');

})

.catch(function(error){

  console.error(error);

  document.body.innerHTML=`

    <div style="
      font-family:Arial;
      padding:40px;
      max-width:800px;
      margin:auto;
    ">

      <h1>Erreur ROOFCON</h1>

      <p>
        ${esc(error.message)}
      </p>

    </div>

  `;

});
function openJobImage(image){

  const lightbox=document.createElement('div');

  lightbox.className='job-lightbox';

  lightbox.innerHTML=`

    <span class="job-lightbox-close">
      &times;
    </span>

    <img
      src="${esc(image)}"
      alt=""
    >

  `;

  lightbox.addEventListener(
    'click',
    function(){
      lightbox.remove();
    }
  );

  document.body.appendChild(lightbox);

}
</script>
