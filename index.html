}

}

.lang {

}

========================================= */

.who {

}


.who .container {

}

/* Une seule colonne, sans espace vide à droite */

}

.who-left {

}

/* Introduction */
.who-left .head {
  max-width: 760px;

}

}

.who-left .head .kicker {

}

}

.who-left .head > p {

}

/* Corps de texte */
.who-left .who-content {
  max-width: 720px;

/* ================================
   NOS SERVICES
================================ */

.about {
  background: var(--black);
  color: #fff;
  padding-top: 0 !important;
  margin-top: 0 !important;
}

.about-intro{
  max-width:none;
  margin-bottom:70px;
}

.about-intro h2{
  font-size:clamp(34px,4vw,58px);
  line-height:1.05;
  margin-bottom:25px;
  letter-spacing:-.02em;

}

.about-intro p{
  max-width:none;
  color:#c9c4c0;
  font-size:18px;
  line-height:1.7;
}

/* GRILLE DES SERVICES */

.poles{
  display:grid;
  grid-template-columns:repeat(12,1fr);
  gap:18px;
}

/* CARTE */

.pole{
  grid-column:span 4;

  background:#262322;
  border:1px solid #3b3634;

  min-height:430px;
  padding:30px;

  position:relative;
  overflow:hidden;

  display:flex;
  flex-direction:column;

  transition:
    transform .35s ease,
    border-color .35s ease,
    background .35s ease;
}

.pole:nth-child(4),
.pole:nth-child(5){
  grid-column:span 6;
  min-height:390px;
}

/* IMAGE */

.pole-image{
  width:calc(100% + 60px);
  height:210px;

  object-fit:cover;

  margin:-30px -30px 28px;

  display:block;

  transition:transform .6s ease;
}

.pole:hover .pole-image{
  transform:scale(1.035);
}

/* NUMÉRO */

.pole-number{
  font-size:11px;
  color:var(--brown2);
  font-weight:800;
  letter-spacing:.2em;
  margin-bottom:18px;
}

/* TITRE */

.pole h3{
  font-size:clamp(21px,2vw,28px);
  line-height:1.08;

  margin:0 0 15px;

  text-align:left;

  letter-spacing:-.02em;

  overflow-wrap:normal;
  word-break:normal;
}

/* DESCRIPTION */

.pole p{
  max-width:520px;

  color:#c9c4c0;

  font-size:15px;
  line-height:1.65;

  margin:0;
}

/* ================================
   ACTIONS
================================ */

.pole-actions{
  margin-top:auto;
  padding-top:28px;

  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:16px;
}

.pole-discover,
.pole-more{
  border:none;
  background:none;

  color:#fff;

  font-family:inherit;
  font-size:11px;
  font-weight:700;

  text-transform:uppercase;
  letter-spacing:.14em;

  cursor:pointer;

  display:inline-flex;
  align-items:center;

  gap:10px;

  transition:
    gap .3s ease,
    opacity .3s ease;
}

.pole-discover::after,
.pole-more::after{
  content:'→';

  font-size:17px;
  line-height:1;

  transition:transform .3s ease;
}

.pole-discover:hover,
.pole-more:hover{
  opacity:.8;
  gap:15px;
}

.pole-discover:hover::after,
.pole-more:hover::after{
  transform:translateX(3px);
}

<script>

let CONTENT = null;

let LANG = new URLSearchParams(window.location.search).get('lang')
  || localStorage.getItem('roofconLang')
  || 'fr';
let currentServiceInfoId = null;

  function updateHreflang(page){

  const routes = {
    'accueil': {
      fr: '/',
      de: '/'
    },
    'about': {
      fr: '/services',
      de: '/leistungen'
    },
    'references': {
      fr: '/realisations',
      de: '/referenzen'
    },
    'current-projects': {
      fr: '/projets-en-cours',
      de: '/aktuelle-projekte'
    },
    'jobs': {
      fr: '/emploi',
      de: '/karriere'
    },
    'contact': {
      fr: '/contact',
      de: '/kontakt'
    }
  };

  const route = routes[page];

  if(!route) return;

  const frLink =
    document.querySelector('link[hreflang="fr"]');

  const deLink =
    document.querySelector('link[hreflang="de"]');

  const defaultLink =
    document.querySelector('link[hreflang="x-default"]');

  if(frLink){
    frLink.href =
      'https://roof-con.com' + route.fr;
  }

  if(deLink){
    deLink.href =
      'https://roof-con.com' + route.de;
  }

  if(defaultLink){
    defaultLink.href =
      'https://roof-con.com' + route.fr;
  }
}
  
  function updateSEO(page){

  if(!CONTENT || !CONTENT.seo) return;

  const seoMap = {
    'accueil': 'home',
    'about': 'services',
    'references': 'references',
    'current-projects': 'currentProjects',
    'jobs': 'jobs',
    'contact': 'contact'
  };

  const seoKey = seoMap[page];

  if(!seoKey || !CONTENT.seo[seoKey]) return;

  const seo = CONTENT.seo[seoKey];

  const title =
    seo.title && seo.title[LANG]
      ? seo.title[LANG]
      : '';

  const description =
    seo.description && seo.description[LANG]
      ? seo.description[LANG]
      : '';

  if(title){
    document.title = title;
  }

  const metaDescription =
    document.querySelector('meta[name="description"]');

  if(metaDescription && description){
    metaDescription.setAttribute(
      'content',
      description
    );
  }
}
  
/* MENU MOBILE */

const mobileMenuButton =
  document.getElementById('mobile-menu-button');

const mainMenu =
  document.getElementById('main-menu');


if(mobileMenuButton && mainMenu){

  mobileMenuButton.addEventListener('click', function(){

    const isOpen =
      mainMenu.classList.toggle('mobile-open');

    mobileMenuButton.setAttribute(
      'aria-expanded',
      isOpen ? 'true' : 'false'
    );

    mobileMenuButton.textContent =
      isOpen ? '×' : '☰';

  });

}


/* FERMER LE MENU APRÈS UN CLIC */

document.addEventListener('click', function(e){

  const link =
    e.target.closest('#main-menu [data-page]');

  if(!link){
    return;
  }

  if(mainMenu){
    mainMenu.classList.remove('mobile-open');
  }

  if(mobileMenuButton){

    mobileMenuButton.textContent='☰';

    mobileMenuButton.setAttribute(
      'aria-expanded',
      'false'
    );

  }

});
  
/* TRADUCTION */

function t(obj){

  if(typeof obj === 'string'){
    return obj;
  }

  return obj && obj[LANG] ? obj[LANG] : '';

}


/* PROTECTION HTML */

function esc(v){

  return String(v ?? '').replace(/[&<>"']/g,function(m){

    return {
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'
    }[m];

  });

}


/* NAVIGATION */

    let chantierMap = null;
let chantierMarkers = [];

function initChantierMap(){

    const mapTitle =
    document.getElementById('map-title');

  const mapSubtitle =
    document.getElementById('map-subtitle');

  if(mapTitle && mapSubtitle){

    if(LANG === 'de'){

      mapTitle.textContent =
        'UNSERE BAUSTELLEN';

      mapSubtitle.textContent =
        'Entdecken Sie unsere Projekte auf der Karte.';

    }

    else{

      mapTitle.textContent =
        'NOS CHANTIERS';

      mapSubtitle.textContent =
        'Retrouvez nos réalisations sur la carte.';

    }

  }
  
  const mapElement =
    document.getElementById('chantier-map');

  if(!mapElement || typeof L === 'undefined'){
    return;
  }

  if(chantierMap){
    chantierMap.remove();
    chantierMap = null;
    chantierMarkers = [];
  }

  chantierMap =
    L.map(mapElement).setView(
      [49.8153, 6.1296],
      9
    );

  L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
      attribution:
        '&copy; OpenStreetMap contributors'
    }
  ).addTo(chantierMap);

  const positions = [];

  CONTENT.references.items.forEach(function(category){

    (category.projects || []).forEach(function(project){

      if(
        project.latitude &&
        project.longitude
      ){

        const lat =
          Number(project.latitude);

        const lng =
          Number(project.longitude);

        if(
          !Number.isNaN(lat) &&
          !Number.isNaN(lng)
        ){

          const marker =
            L.marker([
              lat,
              lng
            ]).addTo(chantierMap);

         const title =
  t(project.title) ||
  'Réalisation ROOFCON';

marker.bindPopup(`
  <strong>${esc(title)}</strong>
  <br>
  <button
    type="button"
    onclick="openMapProject('${category.id}', '${project.id}')"
    style="margin-top:8px; cursor:pointer;">
    Voir la réalisation
  </button>
`);

          chantierMarkers.push(marker);

          positions.push([
            lat,
            lng
          ]);

        }

      }

    });

  });

  /* PROJETS EN COURS */

if(CONTENT.currentProjects){

  (CONTENT.currentProjects.items || []).forEach(function(project){

    if(
      project.latitude &&
      project.longitude
    ){

      const lat =
        Number(project.latitude);

      const lng =
        Number(project.longitude);

      if(
        !Number.isNaN(lat) &&
        !Number.isNaN(lng)
      ){

        const currentProjectIcon =
          L.divIcon({
            className:'current-project-map-marker',
            html:'<div></div>',
            iconSize:[22,22],
            iconAnchor:[11,11]
          });

const marker =
  L.marker(
    [lat,lng],
    {
      icon:currentProjectIcon
    }
  ).addTo(chantierMap);

marker.currentProjectId = project.id;
        
        const title =
          t(project.title) ||
          'Projet en cours';

        const description =
          t(project.description) ||
          '';

marker.bindPopup(`
  <div class="map-popup-current">

    <strong>${esc(title)}</strong>

    <div class="map-popup-label">

  function initReveal(){

  const elements = document.querySelectorAll(
    'section > .wrap, .pole, .reference-category, .ref, .job, .contact-card'
  );

  elements.forEach(function(element){
    element.classList.add('reveal');
  });

  const observer = new IntersectionObserver(function(entries){

    entries.forEach(function(entry){

      if(entry.isIntersecting){
        entry.target.classList.add('visible');
      }

    });

  },{
    threshold:0.15
  });

  elements.forEach(function(element){
    observer.observe(element);
  });

}

  currentReferenceIndex += direction;


  if(currentReferenceIndex < 0){
    currentReferenceIndex =
      currentReferenceImages.length - 1;
  }


  if(
    currentReferenceIndex >=
    currentReferenceImages.length
  ){

    currentReferenceIndex=0;

  }


  const image =
    document.getElementById(
      'reference-gallery-image'
    );


  const counter =
    document.getElementById(
      'reference-gallery-counter'
    );


  if(image){

    image.src =
      currentReferenceImages[
        currentReferenceIndex
      ];

  }


  if(counter){

    counter.textContent =
      (currentReferenceIndex + 1) +
      ' / ' +
      currentReferenceImages.length;

  }

}

];

const requestedLang =

  localStorage.setItem('roofconLang', 'de');

  localStorage.setItem('roofconLang', 'fr');


} else if (currentPath === '') {

  LANG = (requestedLang === 'de' || requestedLang === 'fr')
    ? requestedLang
    : (localStorage.getItem('roofconLang') || 'fr');

} else if (requestedLang === 'de' || requestedLang === 'fr') {

  function changeJobImage(jobId, direction){

  const job =
    CONTENT.jobs.items.find(function(item){
      return item.id === jobId;
    });

  if(!job || !Array.isArray(job.images) || job.images.length < 2){
    return;
  }

  const gallery =
    document.querySelector(
      '.job-gallery[data-job-id="' + jobId + '"]'
    );

  if(!gallery){
    return;
  }

  const image =
    gallery.querySelector('.job-gallery-image');

  if(!image){
    return;
  }

  let currentIndex =
    parseInt(gallery.dataset.index || '0', 10);

  currentIndex += direction;

  if(currentIndex < 0){
    currentIndex = job.images.length - 1;
  }

  if(currentIndex >= job.images.length){
    currentIndex = 0;
  }

  gallery.dataset.index = currentIndex;

  image.src = job.images[currentIndex];

  image.alt =
    t(job.title) + ' - Photo ' + (currentIndex + 1);

  image.onclick = function(){
    openJobImage(job.images[currentIndex]);
  };

}
  
function openJobImage(image){

  const lightbox=document.createElement('div');

  lightbox.className='job-lightbox';

  lightbox.innerHTML=`

    <span class="job-lightbox-close">
      &times;
    </span>

    <img
      src="${esc(image)}"
      alt=""
    >

  `;

  lightbox.addEventListener(
    'click',
    function(){
      lightbox.remove();
    }
  );

  document.body.appendChild(lightbox);

}
