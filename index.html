<style>
:root{
  --black:#211f20;
  --brown:#a27b5b;

}

*{

  margin:0;
  padding:0;
}

html{

}

}

a{

}

button,

}

.container{

/* TOP BAR */

  font-size:13px;
}

}

}

.contact-card .item a#contact-phone,
.contact-card .item a#contact-email{

}

.contact-card .item a#contact-phone:hover,
.contact-card .item a#contact-email:hover{

  text-underline-offset:3px;
}

.contact-card .item a:hover{

  text-decoration:underline;
  text-underline-offset:3px;
}
  
.menu .cta{

  color:#fff;
  padding:12px 18px;
}

}

.lang{

  gap:4px;
  margin-left:auto;
}

}

.lang button.active{
  background:var(--brown);
  color:#fff;
  border-color:var(--brown);
}

/* PAGES */

section{
  padding:92px 0;
  display:none;
}

section.active-page{
  display:block;
}

/* HERO */

.hero{
  min-height:690px;
  position:relative;
  display:none;
  align-items:center;
  overflow:hidden;

  background:
    linear-gradient(
      90deg,
      rgba(20,18,18,.93) 0%,
      rgba(20,18,18,.76) 47%,
      rgba(20,18,18,.25) 100%

      135deg,
      #292626 0%,
      #685344 55%,
      #b29273 100%

}

.hero.active-page{

}

.hero.has-image{
  background-position:center;
  background-size:cover;
  background-repeat:no-repeat;
}

.hero:before{
  content:"";
  position:absolute;
  right:-120px;
  top:-160px;
  width:600px;
  height:600px;
  border:95px solid rgba(195,160,128,.18);
  transform:rotate(45deg);
}

.hero .container{
  position:relative;
  z-index:2;
}

.hero-content{
  max-width:760px;
  color:#fff;
  padding:80px 0;
}

.hero-logo{
  width:min(330px,70vw);
  height:auto;
  margin-bottom:32px;
  background:#fff;
  padding:12px;
}

.kicker{
  text-transform:uppercase;
  letter-spacing:3px;
  font-size:13px;
  font-weight:800;
  color:var(--brown2);
  margin-bottom:15px;
}

h1{
  font-size:clamp(45px,6.5vw,80px);
  line-height:.98;
  letter-spacing:-3px;
  margin-bottom:24px;
}

h1 span{
  color:#c3a080;
}

.hero p{
  font-size:19px;
  color:#eee;
  max-width:650px;
  margin-bottom:32px;
}

.buttons{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.btn{
  display:inline-block;
  padding:15px 23px;
  font-weight:800;
  border:1px solid transparent;
  cursor:pointer;
}

.primary{
  background:var(--brown);
  color:#fff;
}

.primary:hover{
  background:var(--black);
}

.outline{
  border-color:rgba(255,255,255,.55);
  color:#fff;
}

.outline:hover{
  background:#fff;
  color:var(--black);
}

/* HEADINGS */

.head{
  max-width:760px;
  margin-bottom:46px;
}

.head h2{
  font-size:clamp(32px,4.2vw,54px);
  line-height:1.05;
  letter-spacing:-1.5px;
}

.head p{
  color:var(--gray);
  font-size:18px;
  margin-top:14px;
}

  /* QUI SOMMES-NOUS */

.who{
  background:#fff;
}

.who-content{
  max-width:850px;
  font-size:18px;
  color:var(--gray);
}

.who-content p{
  margin-bottom:22px;
}

.who-content strong{
  color:var(--black);
}

.who-content .btn{
  margin-top:10px;
}
/* ABOUT */

.about{
  background:var(--black);
  color:#fff;
}

.about-intro{
  max-width:850px;
  margin-bottom:50px;
}

.about-intro h2{
  font-size:clamp(34px,4.5vw,58px);
  line-height:1.05;
  margin-bottom:20px;
}

.about-intro p{
  color:#c9c4c0;
  font-size:18px;
}

.poles{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:16px;
}

.pole{
  background:#2c2928;
  border:1px solid #403b39;
  min-height:330px;
  padding:30px;
  position:relative;
  overflow:hidden;
}

 .pole{
  transition:transform .25s ease, box-shadow .25s ease;
}

.pole:hover{
  transform:translateY(-4px);
  box-shadow:0 12px 30px rgba(0,0,0,.12);
}
  
.pole-image{
  width:calc(100% + 60px);
  height:170px;
  object-fit:cover;
  margin:-30px -30px 25px;
  display:block;
}

.pole-number{
  font-size:13px;
  color:var(--brown2);
  font-weight:900;
  letter-spacing:2px;
}

.pole h3{
  font-size:24px;
  margin:18px 0 10px;
}

.pole p{
  color:#c9c4c0;
  font-size:15px;
}

/* REFERENCES */

.refs{
  background:var(--cream);
}

/* REFERENCES */

.refs{
  background:#f4f2ef;
  padding:100px 0;
}

.refs .head{
  max-width:800px;
  margin-bottom:50px;
}

.reference-categories{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:24px;
  margin-bottom:45px;
}

.reference-category{
  grid-column:span 2;
}

.reference-category:nth-child(4){
  grid-column:2 / span 2;
}

.reference-category:nth-child(5){
  grid-column:4 / span 2;
}

.reference-category{
  position:relative;
  min-height:360px;
  border:0;
  padding:0;
  overflow:hidden;
  cursor:pointer;
  background-color:#2c2928;
  background-position:center;
  background-size:cover;
  background-repeat:no-repeat;
  color:#fff;
  transition:
    transform .3s ease,
    box-shadow .3s ease;
}

.reference-category::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      to top,
      rgba(20,18,18,.82) 0%,
      rgba(20,18,18,.30) 55%,
      rgba(20,18,18,.12) 100%
    );
  z-index:1;
}

.reference-category:hover{
  transform:translateY(-5px);
  box-shadow:0 15px 35px rgba(33,31,32,.18);
}

.reference-category.active{
  box-shadow:
    inset 0 0 0 3px var(--brown);
}

.reference-category-content{
  position:absolute;
  inset:0;
  z-index:2;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;

  padding:35px 25px;
  text-align:center;
}

.reference-category-icon{
  width:58px;
  height:58px;
  margin-bottom:16px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.reference-category-icon svg{
  width:52px;
  height:52px;
  fill:none;
  stroke:#fff;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.reference-category-title{
  font-size:28px;
  line-height:1.1;
  font-weight:800;
  color:#fff;
}

@media(max-width:800px){

  .reference-categories{
    grid-template-columns:1fr;
    gap:18px;
  }

  .reference-category{
    min-height:300px;
    grid-column:auto;
  }

  .reference-category:nth-child(4),
  .reference-category:nth-child(5){
    grid-column:auto;
  }

  .reference-category-title{
    font-size:24px;
  }

}

.refs-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:24px;
}

.ref{
  position:relative;
  overflow:hidden;
  min-height:420px;
  background:#d8d4cf;
  cursor:pointer;
  transition:transform .3s ease;
}

  .ref{
  cursor:pointer;
  pointer-events:auto;
}

.ref-content,
.ref img,
.ref-placeholder{
  pointer-events:none;
}
  
.ref:hover{
  transform:translateY(-4px);
}

.ref img{
  width:100%;
  height:420px;
  object-fit:cover;
  display:block;
  transition:transform .5s ease;
}

.ref:hover img{
  transform:scale(1.04);
}

.ref::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    to top,
    rgba(0,0,0,.75),
    rgba(0,0,0,.05) 65%
  );
  pointer-events:none;
}

.ref-content{
  position:absolute;
  left:32px;
  right:32px;
  bottom:28px;
  z-index:2;
  color:#fff;
}

.ref-content h3{
  margin:0 0 8px;
  font-size:25px;
  line-height:1.15;
}

.ref-content p{
  margin:0;
  font-size:14px;
  line-height:1.6;
  opacity:.9;
}

@media(max-width:800px){

  .refs{
    padding:70px 0;
  }

  .refs-grid{
    grid-template-columns:1fr;
  }

  .ref,
  .ref img{
    min-height:340px;
    height:340px;
  }

  .ref-content{
    left:22px;
    right:22px;
    bottom:22px;
  }

}

.ref:hover{
  transform:translateY(-5px);
  box-shadow:0 15px 35px #211f2012;
}

.ref-image{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

.ref-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(
    transparent 25%,
    rgba(20,18,18,.88) 100%
  );
}

.ref .label{
  position:absolute;
  left:18px;
  right:18px;
  bottom:18px;
  color:#fff;
  z-index:2;
}

.ref .label small{
  color:var(--brown2);
  text-transform:uppercase;
  font-weight:800;
  letter-spacing:1px;
}

.ref .label h3{
  font-size:24px;
  margin-top:5px;
}

/* REFERENCE DETAIL */

.reference-detail{
  background:#f4f2ef;
  padding:90px 0 110px;
}

.detail-back{
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin-bottom:55px;
  color:#222;
  font-size:14px;
  font-weight:700;
  text-decoration:none;
  transition:.25s ease;
}

.back-arrow{
  display:inline-block;

}

.detail-back:hover{
  transform:translateX(-4px);
}

.detail-back:hover{
  transform:translateX(-4px);
}

.reference-detail .head{

}

.reference-detail .kicker{

.reference-detail h2{

}

.reference-detail .head p{

}

.detail-projects{

}

.project-detail{
  background:#fff;

}

.project-detail-image{
  width:100%;

}

.project-detail-image img{

}

  .reference-gallery{
  position:relative;
  width:100%;
  background:#ddd8d2;
  overflow:hidden;
}

.reference-gallery img{
  width:100%;
  height:650px;
  object-fit:cover;
  object-position:center;
  display:block;
}

.reference-gallery-button{
  position:absolute;
  top:20%;
  transform:translateY(-50%);

  width:46px;
  height:46px;

  border:0;
  border-radius:50%;

  background:rgba(0,0,0,.55);
  color:#fff;

  font-size:30px;

  display:flex;

  justify-content:center;

  cursor:pointer;

    background .25s ease,

}

.reference-gallery-button:hover{

}

.reference-gallery-button.prev{

}

}

.reference-gallery-counter{

@media(max-width:800px){

  .reference-gallery img{

  }

  }

  .reference-gallery-button.prev{
    left:12px;
  }

  .reference-gallery-button.next{
    right:12px;
  }

  .reference-gallery-counter{
    right:12px;

  }

}
  
.project-detail-content{
  padding:42px 48px 50px;
}

.project-detail-category{
  color:#8a8179;
  font-size:12px;
  font-weight:800;
  letter-spacing:.15em;
  text-transform:uppercase;
  margin-bottom:12px;
}

.project-detail-content h3{
  margin:0 0 18px;
  color:#202020;
  font-size:32px;
  line-height:1.15;
}

.project-detail-content p{
  max-width:850px;
  margin:0;

}

.project-detail-placeholder{
  height:500px;
  display:flex;
  align-items:center;

  background:#d8d4cf;
  color:#777;
  font-size:28px;
  font-weight:800;
  letter-spacing:.15em;
}


/* MOBILE */

@media(max-width:800px){

  .reference-detail{
    padding:65px 0 80px;
  }

  .detail-back{
    margin-bottom:40px;
  }

  .reference-detail h2{

.project-detail-image img{

/* JOBS */

.jobs{
  background:#fff;
}

.jobs-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.job{
  border:1px solid var(--line);
  background:var(--cream);
  overflow:hidden;
}

.job img{
  width:100%;
  height:240px;
  object-fit:cover;
  display:block;
}
  
.job-gallery{
  position:relative;
  width:100%;
  height:240px;
  overflow:hidden;
  display:block;
}

.job-gallery-image{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  cursor:pointer;
}
  
.job-gallery-arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);

  width:42px;
  height:42px;

  border:0;
  border-radius:50%;

  background:rgba(20,18,18,.65);
  color:#fff;

  font-size:32px;
  line-height:1;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  z-index:5;

  transition:
    background .2s ease,
    transform .2s ease;
}

.job-gallery-arrow:hover{
  background:rgba(20,18,18,.9);
  transform:translateY(-50%) scale(1.08);
}

.job-gallery-prev{
  left:15px;
}

.job-gallery-next{
  right:15px;
}
  
.job-gallery img{
  width:100%;
  height:240px;
  object-fit:cover;
  display:block;
}

.job-gallery img:only-child{
  grid-column:1 / -1;
}
  
.job-gallery img{
  cursor:pointer;
}

.job-lightbox{
  position:fixed;
  inset:0;

}

.job-lightbox img{

}

.job-lightbox-close{

  top:20px;

  line-height:1;
}  
.job-content{
  padding:28px;
}

.job h3{

}

.job p{

}

.job-button{

}

  background:#fff;
}

.contact-grid{
  display:grid;
  grid-template-columns:1.05fr .95fr;
  gap:60px;
}

.contact-title{
  font-size:clamp(34px,4.5vw,58px);

}

.contact-intro{
  color:var(--gray);

  margin-top:16px;
}

.contact-details{
  margin-top:30px;
}

.item{

}

.item small{

}

.item a,
.item span{

}

.contact-card{

.contact-card h3{

.contact-card p{

.footer-item{

}

}

.footer-item a:hover{

}

<script>

let CONTENT = null;

let LANG = localStorage.getItem('roofconLang') || 'fr';

/* MENU MOBILE */

const mobileMenuButton =
  document.getElementById('mobile-menu-button');

const mainMenu =
  document.getElementById('main-menu');


if(mobileMenuButton && mainMenu){

  mobileMenuButton.addEventListener('click', function(){

    const isOpen =
      mainMenu.classList.toggle('mobile-open');

    mobileMenuButton.setAttribute(
      'aria-expanded',
      isOpen ? 'true' : 'false'
    );

    mobileMenuButton.textContent =
      isOpen ? '×' : '☰';

  });

}


/* FERMER LE MENU APRÈS UN CLIC */

document.addEventListener('click', function(e){

  const link =
    e.target.closest('#main-menu [data-page]');

  if(!link){
    return;
  }

  if(mainMenu){
    mainMenu.classList.remove('mobile-open');
  }

  if(mobileMenuButton){

    mobileMenuButton.textContent='☰';

    mobileMenuButton.setAttribute(
      'aria-expanded',
      'false'
    );

  }

});
  
/* TRADUCTION */

function t(obj){

  if(typeof obj === 'string'){
    return obj;
  }

  return obj && obj[LANG] ? obj[LANG] : '';

}


/* PROTECTION HTML */

function esc(v){

  return String(v ?? '').replace(/[&<>"']/g,function(m){

    return {
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'
    }[m];

  });

}


/* NAVIGATION */

function showPage(id){

  document.querySelectorAll('section').forEach(function(section){
    section.classList.remove('active-page');
  });

  const page=document.getElementById(id);

  if(page){
    page.classList.add('active-page');
  }

  window.scrollTo({
    top:0,
    behavior:'smooth'
  });

  setTimeout(function(){

    if(page){

      page.querySelectorAll('.reveal').forEach(function(element){
        element.classList.remove('visible');
      });

      setTimeout(function(){

        page.querySelectorAll('.reveal').forEach(function(element){
          element.classList.add('visible');
        });

      },50);

    }

  },50);

}
  function initReveal(){

  const elements = document.querySelectorAll(
    'section > .wrap, .pole, .reference-category, .ref, .job, .contact-card'
  );

  elements.forEach(function(element){
    element.classList.add('reveal');
  });

  const observer = new IntersectionObserver(function(entries){

    entries.forEach(function(entry){

      if(entry.isIntersecting){
        entry.target.classList.add('visible');
      }

    });

  },{
    threshold:0.15
  });

  elements.forEach(function(element){
    observer.observe(element);
  });

}
  
function openReferenceCategory(category){

  currentReferenceCategoryId = category;
  
const categoryData =
    CONTENT.references.items.find(function(item){

      return item.id === category;

    });


  if(!categoryData){
    return;
  }


  /* OUVRIR LA NOUVELLE VUE */

  showPage('reference-category-detail');


  /* TITRE */

  const title =
    document.getElementById(
      'category-detail-title'
    );

  if(title){

    title.textContent =
      t(categoryData.title);

  }


  /* PETIT TEXTE */

  const intro =
    document.getElementById(
      'category-detail-intro'
    );

  if(intro){

    intro.textContent =
      LANG === 'fr'
        ? 'Découvrez nos réalisations dans ce domaine.'
        : 'Entdecken Sie unsere Projekte in diesem Bereich.';

  }


  /* KICKER */

  const kicker =
    document.getElementById(
      'category-detail-kicker'
    );

  if(kicker){

    kicker.textContent =
      LANG === 'fr'
        ? 'Nos réalisations'
        : 'Unsere Referenzen';

  }


  /* PROJETS */

  const projects =
    document.getElementById(
      'category-detail-projects'
    );


  if(!projects){
    return;
  }


  if(!categoryData.projects ||
     !categoryData.projects.length){

    projects.innerHTML = `

      <div class="refs-empty">

        ${
          LANG === 'fr'
            ? 'Nos réalisations seront bientôt disponibles.'
            : 'Unsere Referenzen werden bald verfügbar sein.'
        }

      </div>

    `;

    return;

  }


  projects.innerHTML =
    categoryData.projects.map(function(project){

      return `

        <article
          class="ref reference-card"
          data-reference-id="${esc(project.id)}">

          ${
            project.image
              ?
              `
                <img
                  class="ref-image"
                  src="${esc(project.image)}"
                  alt="${esc(t(project.title))}">
              `
              :
              `
                <div class="ref-placeholder">
                  <span>ROOFCON</span>
                </div>
              `
          }

          <div class="ref-overlay"></div>

          <div class="ref-content">

            <p class="ref-category">
              ${esc(t(categoryData.title))}
            </p>

            <h3>
              ${esc(t(project.title))}
            </h3>

            ${
              project.description?.fr ||
              project.description?.de
              ?
              `
                <p>
                  ${esc(t(project.description))}
                </p>
              `
              :
              ''
            }

          </div>

        </article>

      `;

    }).join('');

}
  
/* LANGUE */

function setLang(lang){

  LANG=lang;

  localStorage.setItem('roofconLang',lang);

  if(CONTENT){
    render();
  }

}


/* RÉFÉRENCE */
  
let currentReferenceCategoryId = null;
  
function openReference(id){

  if(!CONTENT || !CONTENT.references){
    return;
  }

  let project=null;
  let category=null;

  CONTENT.references.items.forEach(function(cat){

    (cat.projects || []).forEach(function(item){

      if(item.id===id){
        project=item;
        category=cat;
      }

    });

  });

  if(!project){
    return;
  }

currentReferenceCategoryId = category.id;
  
  /* PHOTOS DU PROJET */

  const images =
    project.images && project.images.length
      ? project.images
      : (project.image ? [project.image] : []);


  currentReferenceImages = images;
  currentReferenceIndex = 0;


  /* TEXTES */

  document.getElementById('detail-kicker').textContent =
    t(category.title);

  document.getElementById('detail-title').textContent =
    t(project.title);

  document.getElementById('detail-intro').textContent =
    t(project.description);

 document.getElementById('detail-back-text').textContent =
  LANG==='fr'
    ? 'Retour aux projets'
    : 'Zurück zu den Projekten';


  /* GALERIE */

  let galleryHTML='';


  if(images.length){

    galleryHTML=`

      <div class="reference-gallery">

        <img
          id="reference-gallery-image"
          src="${esc(images[0])}"
          alt="${esc(t(project.title))}"
        >

        ${
          images.length > 1
          ?
          `

            <button
              type="button"
              class="reference-gallery-button prev"
              onclick="changeReferenceImage(-1)"
              aria-label="Photo précédente">
              ‹
            </button>

            <button
              type="button"
              class="reference-gallery-button next"
              onclick="changeReferenceImage(1)"
              aria-label="Photo suivante">
              ›
            </button>

            <div
              class="reference-gallery-counter"
              id="reference-gallery-counter">
              1 / ${images.length}
            </div>

          `
          :
          ''
        }

      </div>

    `;

  }
  else{

    galleryHTML=`

      <div class="project-detail-placeholder">
        ROOFCON
      </div>

    `;

  }


  /* CONTENU */

  document.getElementById('detail-projects').innerHTML=`

    <article class="project-detail">

      ${galleryHTML}

      <div class="project-detail-content">

        <div class="project-detail-category">
          ${esc(t(category.title))}
        </div>

        <h3>
          ${esc(t(project.title))}
        </h3>

        ${
          t(project.description)
            ?
            `
              <p>
                ${esc(t(project.description))}
              </p>
            `
            :
            ''
        }

      </div>

    </article>

  `;


  showPage('reference-detail');

}

  let currentReferenceImages = [];
let currentReferenceIndex = 0;

  function changeReferenceImage(direction){

  if(!currentReferenceImages.length){
    return;
  }


  currentReferenceIndex += direction;


  if(currentReferenceIndex < 0){
    currentReferenceIndex =
      currentReferenceImages.length - 1;
  }


  if(
    currentReferenceIndex >=
    currentReferenceImages.length
  ){

    currentReferenceIndex=0;

  }


  const image =
    document.getElementById(

  function changeJobImage(jobId, direction){

  const job =
    CONTENT.jobs.items.find(function(item){
      return item.id === jobId;
    });

  if(!job || !Array.isArray(job.images) || job.images.length < 2){
    return;
  }

  const gallery =
    document.querySelector(
      '.job-gallery[data-job-id="' + jobId + '"]'
    );

  if(!gallery){
    return;
  }

  const image =
    gallery.querySelector('.job-gallery-image');

  if(!image){
    return;
  }

  let currentIndex =
    parseInt(gallery.dataset.index || '0', 10);

  currentIndex += direction;

  if(currentIndex < 0){
    currentIndex = job.images.length - 1;
  }

  if(currentIndex >= job.images.length){
    currentIndex = 0;
  }

  gallery.dataset.index = currentIndex;

  image.src = job.images[currentIndex];

  image.alt =
    t(job.title) + ' - Photo ' + (currentIndex + 1);

  image.onclick = function(){
    openJobImage(job.images[currentIndex]);
  };

}
  
function openJobImage(image){

  const lightbox=document.createElement('div');

  lightbox.className='job-lightbox';

  lightbox.innerHTML=`

    <span class="job-lightbox-close">
      &times;
    </span>

    <img
      src="${esc(image)}"
      alt=""
    >

  `;

  lightbox.addEventListener(
    'click',
    function(){
      lightbox.remove();
    }
  );

  document.body.appendChild(lightbox);

}
