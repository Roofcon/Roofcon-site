<style>
/* =========================================================
   ROOFCON — PAGE D'ACCUEIL
   Même langage visuel que la page « Nos services »
========================================================= */

:root{
  --black:#211f20;
  --ink:#171616;
  --brown:#a27b5b;
  --brown2:#c3a080;
  --brown-dark:#8a6245;
  --cream:#f5f2ee;
  --beige:#f3eee8;
  --beige-line:#d8c9ba;
  --white:#fff;
  --gray:#706b67;
  --line:#e5dfda;
}

*{ box-sizing:border-box; margin:0; padding:0; }

html{ scroll-behavior:smooth; }

body{
  font-family:Arial,Helvetica,sans-serif;
  color:var(--black);
  line-height:1.6;
  background:#fff;
}

a{ text-decoration:none; color:inherit; }
button{ font-family:inherit; }

img{ max-width:100%; }

:focus-visible{
  outline:2px solid var(--brown);
  outline-offset:3px;
}

.container{
  width:min(1180px,92%);
  margin:auto;
}

/* Largeur du contenu des sections, identique à la page Services */
.wide{
  width:min(1500px,92%);
  margin-inline:auto;
}

/* =========================================================
   BARRE SUPÉRIEURE
========================================================= */

.top{
  background:var(--black);
  color:#ddd;
  font-size:14px;
  padding:8px 0;
}

.top-inner{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:15px;
}

.top a{ color:inherit; text-decoration:none; }

.top-contact{
  display:flex;
  align-items:center;
  gap:18px;
  white-space:nowrap;
}

.top-social{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  white-space:nowrap;
}

.top-social svg{
  display:block;
  width:16px;
  height:16px;
  flex:0 0 16px;
}

.top-social:hover,
.top a:hover{ color:var(--brown2); }

/* =========================================================
   HEADER
========================================================= */

header{
  position:sticky;
  top:0;
  z-index:100;
  background:#fff;
  border-bottom:1px solid var(--line);
}

.nav{
  min-height:82px;
  display:flex;
  align-items:center;
  gap:35px;
}

.nav-logo{
  display:flex;
  align-items:center;
  flex-shrink:0;
}

.nav-logo img{
  display:block;
  width:175px;
  height:auto;
}

.menu{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:28px;
  margin-left:auto;
  font-size:13px;
  font-weight:600;
}

.menu a{
  position:relative;
  color:var(--black);
  white-space:nowrap;
  transition:color .2s ease;
}

.menu a::after{
  content:"";
  position:absolute;
  left:0;
  bottom:-7px;
  width:0;
  height:1px;
  background:var(--brown);
  transition:width .2s ease;
}

.menu a:hover{ color:var(--brown); }
.menu a:hover::after{ width:100%; }

.menu .cta{
  background:var(--brown);
  color:#fff;
  padding:11px 18px;
  transition:background .25s ease;
}

.menu .cta::after{ display:none; }

.menu .cta:hover{
  background:var(--black);
  color:#fff;
}

.lang{
  display:flex;
  align-items:center;
  gap:4px;
  flex-shrink:0;
}

.lang a{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:34px;
  height:30px;
  padding:0 8px;
  border:1px solid var(--line);
  background:#fff;
  color:var(--black);
  font-size:11px;
  font-weight:700;
  line-height:1.2;
  transition:background .2s ease,color .2s ease,border-color .2s ease;
}

.lang a:hover{
  border-color:var(--brown);
  color:var(--brown);
}

.lang a.active{
  background:var(--brown);
  border-color:var(--brown);
  color:#fff;
}

.mobile-menu-button{ display:none; }

/* =========================================================
   PAGES (une seule section « accueil »)
========================================================= */

section{ display:none; }
section.active-page{ display:block; }

#accueil{ padding:0; }

/* =========================================================
   HERO
========================================================= */

.hero-content{
  position:relative;
  width:100%;
  min-height:clamp(520px,72vh,720px);
  padding:110px max(4%,calc((100vw - 1500px) / 2)) 90px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:flex-start;
  background-color:var(--black);
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  color:#fff;
}

.kicker{
  display:flex;
  align-items:center;
  gap:18px;
  margin-bottom:20px;
  color:var(--brown);
  font-size:11px;
  font-weight:700;
  letter-spacing:2.5px;
  text-transform:uppercase;
}

.kicker::after{
  content:"";
  width:80px;
  height:1px;
  background:var(--line);
}

.hero-content .kicker{ color:#e2c4a7; }
.hero-content .kicker::after{ background:rgba(255,255,255,.35); }

.hero-content h1{
  max-width:1000px;
  margin-bottom:25px;
  color:#fff;
  font-size:clamp(40px,5.4vw,72px);
  font-weight:500;
  line-height:1.05;
  letter-spacing:-2.4px;
}

.hero-content h1 span{
  display:block;
  margin-top:14px;
  color:#dfb995;
  font-size:.58em;
  line-height:1.15;
  letter-spacing:-1px;
}

.hero-content p{
  max-width:680px;
  margin-bottom:34px;
  color:rgba(255,255,255,.9);
  font-size:17px;
  line-height:1.85;
}

.hero-content p span{ display:block; }

.buttons{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.btn{
  display:inline-block;
  padding:15px 26px;
  border:1px solid transparent;
  font-size:12px;
  font-weight:700;
  letter-spacing:.06em;
  cursor:pointer;
  transition:background-color .25s ease,color .25s ease;
}

.primary{
  background:var(--brown);
  color:#fff;
}

.primary:hover{
  background:var(--black);
  color:#fff;
}

.hero-content .primary:hover{
  background:#fff;
  color:var(--black);
}

/* =========================================================
   BANDES DE SECTION
========================================================= */

.band{
  padding:96px 0;
  background:#fff;
}

.band-cream{ background:var(--cream); }

.home-preview-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:40px;
  margin-bottom:48px;
}

.home-preview-head h2{
  max-width:820px;
  color:var(--ink);
  font-size:clamp(30px,3.4vw,46px);
  font-weight:500;
  line-height:1.1;
  letter-spacing:-1.5px;
}

.home-preview-link{
  flex-shrink:0;
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding-bottom:8px;
  border-bottom:1px solid var(--beige-line);
  color:var(--brown-dark);
  font-size:10px;
  font-weight:700;
  letter-spacing:1.5px;
  text-transform:uppercase;
  transition:gap .3s ease,color .3s ease;
}

.home-preview-link::after{
  content:"→";
  font-size:17px;
  line-height:1;
}

.home-preview-link:hover{
  gap:15px;
  color:var(--black);
}

/* =========================================================
   SERVICES — cartes beige, photo fondue (comme la page Services)
========================================================= */

.home-services-grid{
  display:grid;
  grid-template-columns:repeat(12,minmax(0,1fr));
  gap:22px;
  align-items:stretch;
}

.home-service-card{
  grid-column:span 4;
  position:relative;
  isolation:isolate;
  overflow:hidden;
  min-width:0;
  min-height:340px;
  padding:30px;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  background:var(--beige);
  border:1px solid var(--beige-line);
  border-radius:3px;
  box-shadow:0 8px 24px rgba(33,31,32,.09);
  transition:transform .3s ease,background .3s ease,border-color .3s ease,box-shadow .3s ease;
}

.home-service-card:nth-child(4),
.home-service-card:nth-child(5){
  grid-column:span 6;
  min-height:300px;
}

.home-service-card:hover{
  transform:translateY(-5px);
  background:#eee5db;
  border-color:var(--brown);
  box-shadow:0 14px 30px rgba(33,31,32,.13);
}

/* Pas de photo dans les cartes de services de l'accueil */
.home-service-image{
  display:none;
}

.home-service-number{
  margin-bottom:18px;
  color:var(--brown);
  font-size:10px;
  font-weight:700;
  letter-spacing:2px;
}

.home-service-card h3{
  margin-bottom:15px;
  color:var(--black);
  font-size:clamp(24px,2.3vw,32px);
  font-weight:500;
  line-height:1.2;
  letter-spacing:-.5px;
}

.home-service-card p{
  max-width:520px;
  color:#625c57;
  font-size:15px;
  line-height:1.75;
}

/* =========================================================
   RÉALISATIONS — photos pleine carte
========================================================= */

.home-references-grid{
  display:grid;
  grid-template-columns:repeat(12,minmax(0,1fr));
  gap:22px;
}

.home-reference-card{
  grid-column:span 4;
  position:relative;
  overflow:hidden;
  min-width:0;
  min-height:360px;
  padding:30px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  background-color:#3a3330;
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  border-radius:3px;
}

.home-reference-card:nth-child(4),
.home-reference-card:nth-child(5){
  grid-column:span 6;
}

.home-reference-card::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:1;
  pointer-events:none;
  background:linear-gradient(
    to top,
    rgba(20,18,17,.85) 0%,
    rgba(20,18,17,.32) 55%,
    rgba(20,18,17,.04) 100%
  );
}

.home-reference-number{
  position:absolute;
  top:26px;
  right:28px;
  z-index:2;
  color:#e2c4a7;
  font-size:10px;
  font-weight:700;
  letter-spacing:2px;
}

.home-reference-card-content{
  position:relative;
  z-index:2;
}

.home-reference-card-content h3{
  max-width:420px;
  margin-bottom:12px;
  color:#fff;
  font-size:clamp(24px,2.5vw,34px);
  font-weight:500;
  line-height:1.15;
  letter-spacing:-.5px;
}

.home-reference-card-content p{
  max-width:480px;
  color:rgba(255,255,255,.85);
  font-size:14px;
  line-height:1.7;
}

/* =========================================================
   PROJETS EN COURS — image au-dessus, titre en dessous
========================================================= */

.home-current-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:22px;
  align-items:stretch;
}

.home-current-card{
  min-width:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:var(--beige);
  border:1px solid var(--beige-line);
  border-radius:3px;
  transition:border-color .3s ease,box-shadow .3s ease;
}

.home-current-card:hover{
  border-color:var(--brown);
  box-shadow:0 14px 30px rgba(33,31,32,.13);
}

.home-current-card-image{
  display:block;
  width:100%;
  aspect-ratio:16 / 10;
  object-fit:cover;
}

.home-current-card-overlay{ display:none; }

.home-current-card-content{
  padding:24px 28px 28px;
}

.home-current-card-content h3{
  color:var(--black);
  font-size:clamp(22px,2.2vw,30px);
  font-weight:500;
  line-height:1.2;
  letter-spacing:-.5px;
}

/* =========================================================
   CARTE DES CHANTIERS
========================================================= */

.home-map-heading{
  margin-bottom:28px;
}

.home-map-heading p{
  max-width:760px;
  color:var(--gray);
  font-size:17px;
  line-height:1.75;
}

.chantier-map{
  width:100%;
  height:clamp(400px,58vh,580px);
  border:1px solid var(--line);
  border-radius:3px;
  overflow:hidden;
}

.leaflet-popup-content-wrapper,
.leaflet-popup-content,
.map-popup-current,
.map-popup-current button{
  pointer-events:auto !important;
}

.map-popup-current button{ cursor:pointer !important; }

.map-popup-label{
  margin-top:4px;
  color:var(--brown);
  font-size:10px;
  font-weight:700;
  letter-spacing:1.5px;
}

.current-project-map-marker{
  background:transparent;
  border:none;
}

.current-project-map-marker div{
  width:22px;
  height:22px;
  border-radius:50%;
  background:#c46a2b;
  border:4px solid #fff;
  box-shadow:0 2px 8px rgba(0,0,0,.45);
}

/* =========================================================
   CONTACT
========================================================= */

.home-contact-preview{
  padding:80px 0 100px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:40px;
}

.home-contact-preview h2{
  max-width:750px;
  color:var(--ink);
  font-size:clamp(36px,4.6vw,60px);
  font-weight:500;
  line-height:1.05;
  letter-spacing:-2px;
}

.home-contact-preview .btn{
  flex-shrink:0;
  padding:16px 28px;
}

/* =========================================================
   FOOTER
========================================================= */

footer{
  background:var(--black);
  color:#aaa29c;
  padding:25px 0 14px;
  font-size:12px;
  line-height:1.65;
}

.footer-grid{
  display:grid;
  grid-template-columns:1.15fr 1fr 1.25fr .7fr;
  align-items:start;
  gap:28px;
}

.footer-logo{
  display:block;
  width:125px;
  max-width:100%;
  height:auto;
  background:#fff;
  padding:5px;
  margin-bottom:12px;
}

#footer-description{
  max-width:240px;
  color:#aaa29c;
  font-size:11px;
  line-height:1.7;
}

.footer-title{
  margin:4px 0 9px;
  color:var(--brown2);
  font-size:10px;
  font-weight:600;
  letter-spacing:.1em;
  text-transform:uppercase;
}

.footer-item{
  margin-bottom:5px;
  color:#aaa29c;
  overflow-wrap:anywhere;
}

.footer-item a,
#footer-address a{
  color:inherit;
  transition:color .2s ease;
}

.footer-item a:hover,
#footer-address a:hover{ color:var(--brown2); }

.footer-social{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:5px;
}

.footer-social a{
  display:inline-flex;
  align-items:center;
  color:#aaa29c;
  transition:color .2s ease;
}

.footer-social a svg{ display:none; }
.footer-social a:hover{ color:var(--brown2); }

.footer-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-top:22px;
  padding-top:12px;
  border-top:1px solid #403a37;
  color:#827a75;
  font-size:10px;
}

.footer-legal{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.footer-legal a{
  color:#827a75;
  transition:color .2s ease;
}

.footer-legal a:hover{ color:var(--brown2); }

/* =========================================================
   TABLETTES
========================================================= */

@media (max-width:1100px){
  .nav{ gap:22px; }
  .menu{ gap:18px; font-size:12px; }
  .nav-logo img{ width:165px; }
}

@media (max-width:1000px){
  .home-services-grid,
  .home-references-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:20px;
  }

  .home-service-card,
  .home-service-card:nth-child(4),
  .home-service-card:nth-child(5),
  .home-reference-card,
  .home-reference-card:nth-child(4),
  .home-reference-card:nth-child(5){
    grid-column:span 1;
  }

  .home-service-card:nth-child(5),
  .home-reference-card:nth-child(5){
    grid-column:1 / -1;
  }

  .home-preview-head{
    flex-direction:column;
    align-items:flex-start;
    gap:22px;
  }

  .footer-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:24px;
  }

  .footer-bottom{
    align-items:flex-start;
    flex-direction:column;
  }
}

@media (max-width:900px){
  .home-current-grid{ grid-template-columns:1fr; }
}

/* =========================================================
   MOBILES
========================================================= */

@media (max-width:750px){
  .top{ display:none; }

  .nav{
    min-height:74px;
    position:relative;
    gap:0;
  }

  .nav-logo img{ width:145px; }

  .lang{
    margin-left:auto;
    margin-right:10px;
  }

  .lang a{
    min-width:30px;
    height:28px;
    padding:0 6px;
    font-size:10px;
  }

  .mobile-menu-button{
    display:flex;
    align-items:center;
    justify-content:center;
    width:42px;
    height:42px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--black);
    cursor:pointer;
    font-size:25px;
    line-height:1;
  }

  .menu{
    display:none;
    position:absolute;
    top:74px;
    left:0;
    right:0;
    flex-direction:column;
    align-items:stretch;
    gap:0;
    margin:0;
    background:#fff;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    box-shadow:0 12px 30px rgba(0,0,0,.08);
  }

  .menu.mobile-open{ display:flex; }

  .menu a{
    width:100%;
    padding:15px 24px;
    border-bottom:1px solid #eee;
    font-size:14px;
  }

  .menu a::after{ display:none; }
  .menu a:last-child{ border-bottom:none; }

  .menu .cta{
    margin:10px 16px;
    width:auto;
    text-align:center;
  }
}

@media (max-width:650px){
  .hero-content{
    min-height:520px;
    padding:80px 6% 55px;
  }

  .hero-content h1{
    font-size:clamp(36px,10vw,48px);
    letter-spacing:-1.5px;
  }

  .hero-content p{
    font-size:15px;
    line-height:1.7;
  }

  .band{ padding:64px 0; }

  .home-preview-head{ margin-bottom:32px; }

  .home-preview-head h2{ font-size:30px; letter-spacing:-1px; }

  .home-services-grid,
  .home-references-grid{
    grid-template-columns:1fr;
    gap:14px;
  }

  .home-service-card,
  .home-service-card:nth-child(4),
  .home-service-card:nth-child(5){
    grid-column:1;
    min-height:260px;
    padding:24px;
  }

  .home-reference-card,

<script>

let CONTENT = null;

let LANG = new URLSearchParams(window.location.search).get('lang')
  || localStorage.getItem('roofconLang')
  || 'fr';

function updateHreflang(page){

  if(page !== 'accueil') return;

  const homeUrl = 'https://roof-con.com/';

  const frLink = document.querySelector('link[hreflang="fr"]');
  const deLink = document.querySelector('link[hreflang="de"]');
  const defaultLink = document.querySelector('link[hreflang="x-default"]');

  if(frLink) frLink.href = homeUrl;
  if(deLink) deLink.href = homeUrl;
  if(defaultLink) defaultLink.href = homeUrl;

}

function updateSEO(page){

  if(!CONTENT || !CONTENT.seo) return;

  const seoMap = {
    'accueil': 'home'
  };

  const seoKey = seoMap[page];

  if(!seoKey || !CONTENT.seo[seoKey]) return;

  const seo = CONTENT.seo[seoKey];

  const title =
    seo.title && seo.title[LANG]
      ? seo.title[LANG]
      : '';

  const description =
    seo.description && seo.description[LANG]
      ? seo.description[LANG]
      : '';

  if(title){
    document.title = title;
  }

  const metaDescription =
    document.querySelector('meta[name="description"]');

  if(metaDescription && description){
    metaDescription.setAttribute('content', description);
  }
}

/* MENU MOBILE */

const mobileMenuButton =
  document.getElementById('mobile-menu-button');

const mainMenu =
  document.getElementById('main-menu');

if(mobileMenuButton && mainMenu){

  mobileMenuButton.addEventListener('click', function(){

    const isOpen =
      mainMenu.classList.toggle('mobile-open');

    mobileMenuButton.setAttribute(
      'aria-expanded',
      isOpen ? 'true' : 'false'
    );

    mobileMenuButton.textContent =
      isOpen ? '×' : '☰';

  });

}

/* FERMER LE MENU APRÈS UN CLIC */

document.addEventListener('click', function(e){

  const link =
    e.target.closest('#main-menu [data-page]');

  if(!link){
    return;
  }

  if(mainMenu){
    mainMenu.classList.remove('mobile-open');
  }

  if(mobileMenuButton){

    mobileMenuButton.textContent='☰';

    mobileMenuButton.setAttribute(
      'aria-expanded',
      'false'
    );

  }

});

/* TRADUCTION */

function t(obj){

  if(typeof obj === 'string'){
    return obj;
  }

  return obj && obj[LANG] ? obj[LANG] : '';

}

/* PROTECTION HTML */

function esc(v){

  return String(v ?? '').replace(/[&<>"']/g,function(m){

    return {
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'
    }[m];

  });

}

/* CARTE DES CHANTIERS */

let chantierMap = null;

function initChantierMap(){

  const mapTitle =
    document.getElementById('map-title');

  const mapSubtitle =
    document.getElementById('map-subtitle');

  if(mapTitle && mapSubtitle){

    if(LANG === 'de'){

      mapTitle.textContent =
        'UNSERE BAUSTELLEN';

      mapSubtitle.textContent =
        'Entdecken Sie unsere Projekte auf der Karte.';

    }

    else{

      mapTitle.textContent =
        'NOS CHANTIERS';

      mapSubtitle.textContent =
        'Retrouvez nos réalisations sur la carte.';

    }

  }

  const mapElement =
    document.getElementById('chantier-map');

  if(!mapElement || typeof L === 'undefined'){
    return;
  }

  if(chantierMap){
    chantierMap.remove();
    chantierMap = null;
  }

  chantierMap =
    L.map(mapElement).setView(
      [49.8153, 6.1296],
      9
    );

  L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
      attribution:
        '&copy; OpenStreetMap contributors'
    }
  ).addTo(chantierMap);

  const positions = [];

  CONTENT.references.items.forEach(function(category){

    (category.projects || []).forEach(function(project){

      if(
        project.latitude &&
        project.longitude
      ){

        const lat =
          Number(project.latitude);

        const lng =
          Number(project.longitude);

        if(
          !Number.isNaN(lat) &&
          !Number.isNaN(lng)
        ){

          const marker =
            L.marker([
              lat,
              lng
            ]).addTo(chantierMap);

          const title =
            t(project.title) ||
            'Réalisation ROOFCON';

          marker.bindPopup(`
            <strong>${esc(title)}</strong>
            <br>
            <button
              type="button"
              onclick="openMapProject('${category.id}','${project.slug || project.id}')"')"
              style="margin-top:8px; cursor:pointer;">
              Voir la réalisation
            </button>
          `);

          positions.push([
            lat,
            lng
          ]);

        }

      }

    });

  });

  /* PROJETS EN COURS */

  if(CONTENT.currentProjects){

    (CONTENT.currentProjects.items || []).forEach(function(project){

      if(
        project.latitude &&
        project.longitude
      ){

        const lat =
          Number(project.latitude);

        const lng =
          Number(project.longitude);

        if(
          !Number.isNaN(lat) &&
          !Number.isNaN(lng)
        ){

          const currentProjectIcon =
            L.divIcon({
              className:'current-project-map-marker',
              html:'<div></div>',
              iconSize:[22,22],
              iconAnchor:[11,11]
            });

          const marker =
            L.marker(
              [lat,lng],
              {
                icon:currentProjectIcon
              }
            ).addTo(chantierMap);

          const title =
            t(project.title) ||
            'Projet en cours';

          const description =
            t(project.description) ||
            '';

          marker.bindPopup(`
            <div class="map-popup-current">

              <strong>${esc(title)}</strong>

              <div class="map-popup-label">
                ${
                  LANG === 'fr'
                    ? 'PROJET EN COURS'
                    : 'AKTUELLES PROJEKT'
                }
              </div>

              ${
                project.address
                  ? `
                    <div style="margin-top:8px;">
                      📍 ${esc(project.address)}
                    </div>
                  `
                  : ''
              }

              ${
                description
                  ? `
                    <div style="margin-top:8px;">
                      ${esc(description)}
                    </div>
                  `
                  : ''
              }

              <button
                type="button"
                class="current-project-button"
                style="margin-top:10px;cursor:pointer;"
              >
                ${
                  LANG === 'fr'
                    ? 'Voir le projet'
                    : 'Projekt ansehen'
                }
              </button>

            </div>
          `);

          marker.on('popupopen', function(){

            const popup =
              marker.getPopup();

            if(!popup){
              return;
            }

            const popupElement =
              popup.getElement();

            if(!popupElement){
              return;
            }

            const button =
              popupElement.querySelector(
                '.current-project-button'
              );

            if(!button){
              return;
            }

            button.onclick = function(event) {
              event.preventDefault();
              event.stopPropagation();

              const destination = LANG === 'de'
                ? '/aktuelle-projekte/bueros-moenchengladbach/'
                : '/projets-en-cours/bureaux-moenchengladbach/';

              window.location.href = destination;
            };

          }); // Fin de marker.on('popupopen')

          positions.push([
            lat,
            lng
          ]);

        }

      }

    });

  }

  if(CONTENT.mapProjects){

    CONTENT.mapProjects.forEach(function(marker){

      if(
        marker.latitude &&
        marker.longitude
      ){

        const lat =
          Number(marker.latitude);

        const lng =
          Number(marker.longitude);

        if(
          !Number.isNaN(lat) &&
          !Number.isNaN(lng)
        ){

          const mapMarker =
            L.marker([
              lat,
              lng
            ]).addTo(chantierMap);

          const title =
            t(marker.title) ||
            'Point ROOFCON';

          const description =
            t(marker.description) ||
            '';

          mapMarker.bindPopup(`
            <strong>${esc(title)}</strong>
            ${
              description
                ? `<br><span>${esc(description)}</span>`
                : ''
            }
          `);

          positions.push([
            lat,
            lng
          ]);

        }

      }

    });

  }

  if(positions.length === 1){

    chantierMap.setView(
      positions[0],
      13
    );

  }

  else if(positions.length > 1){

    chantierMap.fitBounds(
      positions,
      {
        padding:[40,40]
      }
    );

  }

  setTimeout(function(){

    chantierMap.invalidateSize();

  },100);

}

function openMapProject(categoryId, projectSlug) {
  const cat = (CONTENT.references.items || []).find(c => c.id === categoryId);
  const catSlug = cat && cat.slug ? (cat.slug[LANG] || cat.slug.fr) : categoryId;
  const base = LANG === 'de' ? '/referenzen/' : '/realisations/';

  window.location.href = base + catSlug + '/' + (projectSlug ? projectSlug + '/' : '');
}

/* NAVIGATION */

function showPage(id){

  updateSEO(id);
  updateHreflang(id);

  const sections =
    document.querySelectorAll('section');

  sections.forEach(function(section){
    section.classList.remove('active-page');
    section.classList.remove('home-visible');
  });

  const page =
    document.getElementById(id);

  if(page){
    page.classList.add('active-page');
  }

  /* URL DE LA PAGE */

  const pageUrls = {
    accueil: '/'
  };

  const newUrl =
    pageUrls[id] || '/';

  if(window.location.pathname !== newUrl){

    history.pushState(
      { page: id },
      '',
      newUrl
    );

  }

  /* SCROLL */

  window.scrollTo({
    top:0,
    behavior:'smooth'
  });

  /* ANIMATIONS */

  setTimeout(function(){

    if(!page) return;

    page
      .querySelectorAll('.reveal')
      .forEach(function(element){
        element.classList.remove('visible');
      });

    setTimeout(function(){

      page
        .querySelectorAll('.reveal')
        .forEach(function(element){
          element.classList.add('visible');
        });

    },50);

  },50);

}

/* LANGUE */

document.addEventListener('click', function(event) {
  const langLink = event.target.closest('#lang-fr, #lang-de');

  if (!langLink) return;

  event.preventDefault();

  const lang = langLink.id === 'lang-de' ? 'de' : 'fr';

  setLang(lang);
});

function setLang(lang){

  LANG = lang;

  console.log('LANGUE CHANGÉE :', LANG);

  localStorage.setItem('roofconLang', lang);

  const currentPath =
    '/' + window.location.pathname.replace(/^\/+|\/+$/g, '');

  const languageRoutes = {
    '/services': { fr: '/services', de: '/leistungen' },
    '/leistungen': { fr: '/services', de: '/leistungen' },

    '/realisations': { fr: '/realisations', de: '/referenzen' },
    '/referenzen': { fr: '/realisations', de: '/referenzen' },

    '/projets-en-cours': { fr: '/projets-en-cours', de: '/aktuelle-projekte' },
    '/aktuelle-projekte': { fr: '/projets-en-cours', de: '/aktuelle-projekte' },

    '/emploi': { fr: '/emploi', de: '/karriere' },
    '/karriere': { fr: '/emploi', de: '/karriere' },

    '/contact': { fr: '/contact', de: '/kontakt' },
    '/kontakt': { fr: '/contact', de: '/kontakt' }
  };

  const route =
    languageRoutes[currentPath];

  if(route && route[lang]){

    history.replaceState(
      { page: route[lang] },
      '',
      route[lang]
    );

  }

  if(!CONTENT) return;

  /* CHANGER LA LANGUE DU SITE */

  render();
  initChantierMap();

}

/* RENDU */

function render(){

  const c = CONTENT;

  if(!c || !c.site){
    return;
  }

  /* TITRE DU DOCUMENT */

  if(c.site.title){
    document.title = t(c.site.title);
  }

  /* BARRE SUPÉRIEURE */

  const topPhone =
    document.getElementById('top-phone');

  if(topPhone){
    topPhone.innerHTML = `
      <a href="tel:+352621765489">
        ${esc(c.site.phone || '')}
      </a>
    `;
  }

  const topEmail =
    document.getElementById('top-email');

  if(topEmail){
    topEmail.innerHTML = `
      <a href="mailto:${esc(c.site.email || '')}">
        ${esc(c.site.email || '')}
      </a>
    `;
  }

  /* NAVIGATION */

  const navHome =
    document.getElementById('nav-home');

  if(navHome){
    navHome.textContent =
      t(c.nav.home);

    navHome.href = LANG === 'fr'
      ? '/'
      : '/?lang=de';
  }

  const navAbout =
    document.getElementById('nav-about');

  if(navAbout){
    navAbout.textContent =
      LANG === 'fr'
        ? 'Nos services'
        : 'Leistungen';

    navAbout.href =
      LANG === 'fr'
        ? '/services/'
        : '/leistungen/';
  }

  const navCurrentProjects =
    document.getElementById('nav-current-projects');

  if(navCurrentProjects){
    navCurrentProjects.textContent =
      LANG === 'fr'
        ? 'Projets en cours'
        : 'Aktuelle Projekte';

    navCurrentProjects.href =
      LANG === 'fr'
        ? '/projets-en-cours/'
        : '/aktuelle-projekte/';
  }

  const navReferences =
    document.getElementById('nav-references');

  if(navReferences){
    navReferences.textContent =
      t(c.nav.references);

    navReferences.href =
      LANG === 'fr'
        ? '/realisations/'
        : '/referenzen/';
  }

  const navJobs =
    document.getElementById('nav-jobs');

  if(navJobs){
    navJobs.textContent =
      t(c.nav.jobs);

    navJobs.href =
      LANG === 'fr'
        ? '/emploi/'
        : '/karriere/';
  }

  const navContact =
    document.getElementById('nav-contact');

  if(navContact){
    navContact.textContent =
      t(c.nav.contact);

    navContact.href =
      LANG === 'fr'
        ? '/contact/'
        : '/kontakt/';
  }

  /* BOUTONS DE LANGUE */

  const langFr =
    document.getElementById('lang-fr');

  const langDe =
    document.getElementById('lang-de');

  if(langFr){
    langFr.classList.toggle(
      'active',
      LANG === 'fr'
    );
  }

  if(langDe){
    langDe.classList.toggle(
      'active',
      LANG === 'de'
    );
  }

  /* HERO */

  const heroKicker =
    document.getElementById('hero-kicker');

  if(heroKicker){
    heroKicker.textContent =
      t(c.hero.kicker);
  }

  const heroTitle =
    document.getElementById('hero-title');

  if(heroTitle){
    heroTitle.innerHTML =
      t(c.hero.title);
  }

  const heroTextElement =
    document.getElementById('hero-text');

  if(heroTextElement){

    const heroText =
      t(c.hero.text) || '';

    const heroParts =
      heroText.split(',');

    heroTextElement.innerHTML =
      `<span class="hero-text-line1">${esc(heroParts[0] || '')}${heroParts.length > 1 ? ',' : ''}</span>` +
      `<span class="hero-text-line2">${esc(heroParts.slice(1).join(',').trim())}</span>`;
  }

  const heroAbout =
    document.getElementById('hero-about');

  if(heroAbout){

    heroAbout.textContent =
      t(c.hero.aboutButton);

    heroAbout.href =
      LANG === 'de'

/* CHARGEMENT */

fetch('/content.json?v='+Date.now())

.then(function(response){

  if(!response.ok){

    throw new Error(
      'Impossible de charger content.json'
    );

  }

  return response.json();

})

.then(function(data){

  CONTENT = data;

  const currentPath =
    window.location.pathname.replace(/^\/+|\/+$/g, '');

  const germanPaths = [
    'leistungen',
    'referenzen',
    'aktuelle-projekte',
    'karriere',
    'kontakt'
  ];

  const frenchPaths = [
    'services',
    'realisations',
    'projets-en-cours',
    'emploi',
    'contact'
  ];

  const params =
    new URLSearchParams(window.location.search);

  const requestedPage =
    params.get('page');

  const requestedLang =
    params.get('lang');

  if (germanPaths.includes(currentPath)) {
    LANG = 'de';
    localStorage.setItem('roofconLang', 'de');

  } else if (frenchPaths.includes(currentPath)) {
    LANG = 'fr';
    localStorage.setItem('roofconLang', 'fr');

  } else if (currentPath === '') {
    // Page d'accueil : conserver la langue demandée
    // ou celle déjà enregistrée.
    LANG = (requestedLang === 'de' || requestedLang === 'fr')
      ? requestedLang
      : (localStorage.getItem('roofconLang') || 'fr');

    localStorage.setItem('roofconLang', LANG);

  } else if (requestedLang === 'de' || requestedLang === 'fr') {
    LANG = requestedLang;
    localStorage.setItem('roofconLang', requestedLang);

  } else {
    LANG = 'fr';
    localStorage.setItem('roofconLang', 'fr');
  }

  render();

  initChantierMap();

  showPage('accueil');

})
.catch(function(error){

  console.error(error);

  document.body.innerHTML=`

    <div style="
      font-family:Arial;
      padding:40px;
      max-width:800px;
      margin:auto;
    ">

      <h1>Erreur ROOFCON</h1>

      <p>
        ${esc(error.message)}
      </p>

    </div>

  `;

});
